  return view.t;
}

/* The cell the robot moved INTO during a frame, before a laser or teleporter
   sent it somewhere else.  For an ordinary step this is simply where it ended. */
function viaCell(frame) {
  if (frame.actual_direction && DELTAS[String(frame.actual_direction)]) {
    const delta = DELTAS[String(frame.actual_direction)];
    return [frame.from_row + delta[0], frame.from_col + delta[1]];
  }
  return [frame.row, frame.col];
}

/* Where R-5 is, how solid it looks, and which way it faces, part way through a
   frame.  This is the only place the special events change the picture. */
function robotPose(frame, t) {
  const from = [frame.from_row, frame.from_col];
  const to = [frame.row, frame.col];
  const via = viaCell(frame);
  let facing = frame.actual_direction || frame.previous_direction || 2;
  let alpha = 1, lift = 0;
  let position = to;

  if (frame.terminal_activated) {
    spawnParticles(frame.row, frame.col, P.warning, 22, { speed: 1.4, rise: 1.6 });
    vignette = 0.7; vignetteColour = P.warning;
  } else if (frame.caught) {
    spawnParticles(frame.row, frame.col, P.danger, 26, { speed: 2.0 });
    vignette = 1; vignetteColour = P.danger;
    shake = REDUCED ? 0 : 6;
  } else if (frame.conveyor_event) {
    spawnParticles(frame.row, frame.col, P.warning, 8, { speed: 0.8 });
  } else if (frame.safe_landing) {
    spawnParticles(frame.row, frame.col, P.success, 26, { speed: 1.4, rise: 1.6 });
    vignette = 0.8; vignetteColour = P.success;
  } else if (frame.crashed) {
    spawnParticles(frame.row, frame.col, P.danger, 30, { speed: 2.4 });
    vignette = 1; vignetteColour = P.danger;
    shake = REDUCED ? 0 : 7;
  } else if (frame.hard_landing) {
    spawnParticles(frame.row, frame.col, P.warning, 18, { speed: 1.6 });
    vignette = 0.7; vignetteColour = P.warning;
    shake = REDUCED ? 0 : 4;
  } else if (frame.collision || frame.boundary) {
    spawnParticles(frame.row, frame.col, P.warning, 12, { speed: 1.3 });
    shake = REDUCED ? 0 : 3.5;
  } else if (frame.pit_fall) {
    /* walk over the edge, then drop out of sight down the shaft */
    if (t < 0.35) {
      const step = easeInOut(t / 0.35);
      position = [from[0] + (to[0]-from[0])*step, from[1] + (to[1]-from[1])*step];
    } else {
      const fall = (t - 0.35) / 0.65;
      position = to;
      lift = -fall * fall * 70;          /* accelerating, as a fall should */
      alpha = 1 - clamp(fall * 1.25, 0, 1);
    }
  } else if (frame.laser_hit) {
    /* walk into the beam, flash, then reappear on the start platform */
    if (t < 0.42) {
      const step = easeInOut(t / 0.42);
      position = [from[0] + (via[0]-from[0])*step, from[1] + (via[1]-from[1])*step];
    } else if (t < 0.62) {
      position = via; alpha = 1 - (t - 0.42) / 0.20;
    } else {
      position = to; alpha = clamp((t - 0.62) / 0.24, 0, 1);
    }
  } else if (frame.used_teleport) {
    /* step onto the pad, dissolve upward, materialise at the other pad */
    if (t < 0.38) {
      const step = easeInOut(t / 0.38);
      position = [from[0] + (via[0]-from[0])*step, from[1] + (via[1]-from[1])*step];
    } else if (t < 0.58) {
      const step = (t - 0.38) / 0.20;
      position = via; alpha = 1 - step; lift = step * 26;
    } else {
      const step = clamp((t - 0.58) / 0.26, 0, 1);
      position = to; alpha = step; lift = (1 - step) * 26;
    }
  } else if (frame.blocked) {
    /* nudge into the obstacle and recoil */
    const bump = t < 0.4 ? easeInOut(t/0.4) * 0.22
                         : 0.22 * (1 - easeInOut(clamp((t-0.4)/0.6, 0, 1)));
    const delta = DELTAS[String(frame.actual_direction)] || [0, 0];
    position = [from[0] + delta[0]*bump, from[1] + delta[1]*bump];
  } else {
    const step = easeInOut(t);
    position = [from[0] + (to[0]-from[0])*step, from[1] + (to[1]-from[1])*step];
  }

  return { row: position[0], col: position[1], facing: facing,
           alpha: clamp(alpha, 0, 1), lift: lift };
}

/* Effects that fire once, the moment a frame starts playing. */
let lastEffectFrame = -1;
let shake = 0, vignette = 0, vignetteColour = P.danger;

function fireEffects(frame, index) {
  if (index === lastEffectFrame) return;
  lastEffectFrame = index;
  const via = viaCell(frame);

  if (frame.terminal_activated) {
    spawnParticles(frame.row, frame.col, P.warning, 22, { speed: 1.4, rise: 1.6 });
    vignette = 0.7; vignetteColour = P.warning;
  } else if (frame.caught) {
    spawnParticles(frame.row, frame.col, P.danger, 26, { speed: 2.0 });
    vignette = 1; vignetteColour = P.danger;
    shake = REDUCED ? 0 : 6;
  } else if (frame.conveyor_event) {
    spawnParticles(frame.row, frame.col, P.warning, 8, { speed: 0.8 });
  } else if (frame.safe_landing) {
    spawnParticles(frame.row, frame.col, P.success, 26, { speed: 1.4, rise: 1.6 });
    vignette = 0.8; vignetteColour = P.success;
  } else if (frame.crashed) {
    spawnParticles(frame.row, frame.col, P.danger, 30, { speed: 2.4 });
    vignette = 1; vignetteColour = P.danger;
    shake = REDUCED ? 0 : 7;
  } else if (frame.hard_landing) {
    spawnParticles(frame.row, frame.col, P.warning, 18, { speed: 1.6 });
    vignette = 0.7; vignetteColour = P.warning;
    shake = REDUCED ? 0 : 4;
  } else if (frame.collision || frame.boundary) {
    spawnParticles(frame.row, frame.col, P.warning, 12, { speed: 1.3 });
    shake = REDUCED ? 0 : 3.5;
  } else if (frame.pit_fall) {
    /* dust kicked off the edge, a red alarm wash and a jolt */
    spawnParticles(frame.row, frame.col, shade(P.warning, -0.2), 18,
                   { speed: 1.4, rise: -0.4, z: 4 });
    vignette = 1; vignetteColour = P.danger;
    shake = REDUCED ? 0 : 6;
  } else if (frame.bridge_collapsed) {
    /* debris falling away from the bridge that just gave out */
    const cell = frame.collapsed_cell || [frame.row, frame.col];
    spawnParticles(cell[0], cell[1], shade(P.collapsing, 0.1), 20,
                   { speed: 1.1, rise: -0.8, z: 2 });
    vignette = 0.45; vignetteColour = P.warning;
    shake = REDUCED ? 0 : 3.5;
  } else if (frame.laser_hit) {
    spawnParticles(via[0], via[1], "#FF8FA3", 26, { speed: 2.2, z: 12 });
    vignette = 1; vignetteColour = P.danger;
    shake = REDUCED ? 0 : 7;
  } else if (frame.keycard_collected) {
    spawnParticles(frame.row, frame.col, P.warning, 24, { speed: 1.5, rise: 1.8 });
    vignette = 0.55; vignetteColour = P.warning;
  } else if (frame.used_teleport) {
    spawnParticles(via[0], via[1], "#C9AFFF", 22, { speed: 1.2, rise: 2.2 });
    spawnParticles(frame.row, frame.col, "#C9AFFF", 22, { speed: 1.2, rise: 2.2 });
    vignette = 0.7; vignetteColour = P.purple;
  } else if (frame.battery_collected) {
    spawnParticles(frame.row, frame.col, P.warning, 24, { speed: 1.5, rise: 1.8 });
    vignette = 0.5; vignetteColour = P.warning;
  } else if (frame.reached_exit) {
    spawnParticles(frame.row, frame.col, P.success, 30, { speed: 1.8, rise: 2.0 });
    vignette = 0.8; vignetteColour = P.success;
  } else if (frame.blocked) {
    spawnParticles(via[0], via[1], P.warning, 8, { speed: 1.0 });
    shake = REDUCED ? 0 : 3;
  } else if (frame.slipped) {
    spawnParticles(frame.row, frame.col, P.cyan, 8, { speed: 0.8 });
  }
}

/* =====================================================================
   The main draw
   ===================================================================== */
let now = 0;

function draw() {
  if (!ctx) return;
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  const frame = FRAMES[clamp(view.index, 0, FRAMES.length-1)];
  const pose = robotPose(frame, view.t);
  const escaped = !!frame.reached_exit || (frame.done && !frame.pit_fall);
  const collapsedNow = collapsedAt(frame);

  /* The fog of war. In gameplay mode a cell the radar has never reached is
     hidden and one it has seen but cannot see now is dimmed, which is exactly
     what the agent knows. The analysis view in Streamlit shows the full map and
     says so. */
  const fogOn = !!SCENE.meta.fogOfWar;
  const visibleNow = new Set((frame.visible_cells || [])
                             .map(cell => cell[0] + "," + cell[1]));
  const seenEver = new Set((frame.seen_cells || [])
                           .map(cell => cell[0] + "," + cell[1]));

  /* camera shake, used only for impacts */
  ctx.save();
  if (shake > 0.1) {
    ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }

  /* Build a draw list sorted back to front, so nearer things cover farther
     things.  R-5 is inserted at its own depth, not simply drawn last. */
  const items = [];
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      const [rr, cc] = rotate(row, col);
      items.push({ depth: rr + cc, kind: "cell", row: row, col: col, rr: rr, cc: cc });
    }
  }
  const [robotRR, robotCC] = rotatePoint(pose.row, pose.col);
  items.push({ depth: robotRR + robotCC + 0.35, kind: "robot" });

  /* Room 3 has a second robot on patrol. Its position comes from the recording,
     interpolated from where it was on the previous frame, so the replay shows the
     patrol exactly as it happened rather than re-simulating it. */
  let guardPose = null;
  if (SCENE.meta.hasGuard && frame.guard_row !== undefined) {
    const earlier = FRAMES[Math.max(0, view.index - 1)];
    const fromRow = earlier.guard_row === undefined ? frame.guard_row : earlier.guard_row;
    const fromCol = earlier.guard_col === undefined ? frame.guard_col : earlier.guard_col;
    const step = easeInOut(clamp(view.t, 0, 1));
    const gRow = fromRow + (frame.guard_row - fromRow) * step;
    const gCol = fromCol + (frame.guard_col - fromCol) * step;
    const [grr, gcc] = rotatePoint(gRow, gCol);
    guardPose = { rr: grr, cc: gcc };
    items.push({ depth: grr + gcc + 0.34, kind: "guard" });
  }

  items.sort((a, b) => a.depth - b.depth);

  drawDust();

  /* A continuous room draws the deck, then its own layer on top: the grid loop
     would have nothing to say about fans, obstacles or a drone between cells. */
  if (CONT) {
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < COLS; col++) {
        const [rr, cc] = rotate(row, col);
        drawFloorTile(rr, cc, "floor");
      }
    }
    drawContinuousLayer(frame, frame.x, frame.y);
    drawParticles();
    drawCoordinates();
    ctx.restore();
    if (vignette > 0.02) drawVignette();
    return;
  }

  items.forEach(item => {
    if (item.kind === "robot") {
      drawRobot(robotRR, robotCC, rotateFacing(pose.facing), pose.alpha,
                { lift: pose.lift });
      return;
    }
    if (item.kind === "guard") {
      drawGuard(guardPose.rr, guardPose.cc, 1);
      return;
    }
    const kind = tileAt(item.row, item.col);
    const rr = item.rr, cc = item.cc;

    if (fogOn) {
      const key = item.row + "," + item.col;
      if (!seenEver.has(key)) {
        /* never scanned: draw an unlit plate so the shape of the room is still
           legible without giving away what is on it */
        fillPath(tileQuad(rr, cc, 0), shade(P.background, 0.02),
                 rgba(P.gridLine, 0.35), 1);
        return;
      }
      ctx.globalAlpha = visibleNow.has(key) ? 1.0 : 0.45;
    }

    if (kind === "wall") { drawWallBlock(rr, cc); ctx.globalAlpha = 1; return; }

    /* An open shaft is a hole, not a floor tile, so it skips the deck entirely. */
    if (kind === "pit") { drawPit(rr, cc); return; }

    /* A collapsing bridge is either intact, going, or already gone. */
    if (kind === "collapsing_bridge") {
      const progress = collapsingProgress(frame, item.row, item.col);
      if (progress !== null) {
        drawCollapsingBridge(rr, cc, progress);
        return;
      }
      if (collapsedNow.has(item.row + "," + item.col)) {
        drawPit(rr, cc);
        return;
      }
      drawFloorTile(rr, cc, kind);
      drawBridge(rr, cc, kind);
      return;
    }

    drawFloorTile(rr, cc, kind);

    switch (kind) {
      case "laser":    drawLaser(rr, cc); break;
      case "teleport": drawTeleportPad(rr, cc, frame.used_teleport && view.t > 0.3
                                                && view.t < 0.8); break;
      case "battery":  if (itemStillThere()) drawBattery(rr, cc); break;
      case "keycard":  if (itemStillThere()) drawKeycard(rr, cc); break;
      case "exit":     drawConsole(rr, cc, escaped); break;
      case "exit_door":
        drawExitDoor(rr, cc, !!frame.has_item, escaped); break;
      case "start":    drawStartPlatform(rr, cc); break;
      case "bridge":
      case "platform": drawBridge(rr, cc, kind); break;
      case "door":
        drawDoor(rr, cc, GRID.doors[item.row + "," + item.col]); break;
      /* ---- Room 3 ---- */
      case "generator_a":
      case "generator_b":
      case "generator_c": {
        const letter = kind.slice(-1);
        drawGenerator(rr, cc, letter.toUpperCase(),
                      generatorState(letter, frame.stage || 0));
        break;
      }
      case "hazard":       drawHazard(rr, cc); break;
      /* ---- Room 5 ---- */
      case "shelf":        drawShelf(rr, cc); break;
      case "crate":        drawCrate(rr, cc); break;
      case "terminal":     drawTerminal(rr, cc, (frame.stage || 0) >= 1); break;
      case "charger":      drawCharger(rr, cc); break;
      case "conveyor":
        drawConveyor(rr, cc, (GRID.conveyors || {})[item.row + "," + item.col]);
        break;
      case "sliding_door": drawSlidingDoor(rr, cc, !!frame.doors_open); break;
      case "reactor_door": drawReactorDoor(rr, cc, (frame.stage || 0) >= 3); break;
      default: break;
    }
    ctx.globalAlpha = 1;
  });

  /* Room 5's maintenance robots, drawn from the recording. */
  if (SCENE.meta.hasRobots) {
    const earlier = FRAMES[Math.max(0, view.index - 1)];
    const step = easeInOut(clamp(view.t, 0, 1));
    (frame.moving_robot_positions || []).forEach((cell, index) => {
      const previous = (earlier.moving_robot_positions || [])[index] || cell;
      const rowNow = previous[0] + (cell[0] - previous[0]) * step;
      const colNow = previous[1] + (cell[1] - previous[1]) * step;
      if (fogOn && !visibleNow.has(cell[0] + "," + cell[1])) return;
      const [grr, gcc] = rotatePoint(rowNow, colNow);
      drawGuard(grr, gcc, 1);
    });
    drawRadar(frame, robotRR, robotCC);
  }

  drawParticles();
  drawCoordinates();
  ctx.restore();

  if (vignette > 0.02) drawVignette();
}

/* The coloured flash over the whole chamber after a big event. */
function drawVignette() {
  const gradient = ctx.createRadialGradient(cssWidth/2, cssHeight/2,
    Math.min(cssWidth, cssHeight) * 0.25, cssWidth/2, cssHeight/2,
    Math.max(cssWidth, cssHeight) * 0.72);
  gradient.addColorStop(0, rgba(vignetteColour, 0));
  gradient.addColorStop(1, rgba(vignetteColour, 0.5 * vignette));
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, cssWidth, cssHeight);
}

/* The facing arrow has to turn with the chamber. */
function rotateFacing(direction) {
  const steps = view.rotation & 3;
  if (!steps) return direction;
  /* UP=1 DOWN=2 LEFT=3 RIGHT=4, turned clockwise one quarter at a time */
  const clockwise = { 1: 4, 4: 2, 2: 3, 3: 1 };
  let result = direction;
  for (let i = 0; i < steps; i++) result = clockwise[result] || result;
  return result;
}

function drawCoordinates() {
  if (!OPTIONS.showCoordinates) return;
  const scale = scaleNow();
  if (scale < 0.5) return;
  ctx.save();
  ctx.font = Math.round(px(8, 8)) + "px " + '"JetBrains Mono", Consolas, monospace';
  ctx.fillStyle = rgba(P.textDim, 0.9);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  /* Column numbers along one far edge, row numbers along the other, so a cell
     can always be read off as (row, col) whichever way the chamber is turned. */
  for (let col = 0; col < COLS; col++) {
    const [rr, cc] = rotate(-0.42, col);
    const point = project(rr, cc + 0.5, 0);
    ctx.fillText("c" + col, point[0], point[1]);
  }
  for (let row = 0; row < ROWS; row++) {
    const [rr, cc] = rotate(row, -0.42);
    const point = project(rr + 0.5, cc, 0);
    ctx.fillText("r" + row, point[0], point[1]);
  }
  ctx.restore();
}

/* =====================================================================
   Heads-up display
   ===================================================================== */
const H = id => document.getElementById(id);

function toneFor(value) {
  if (value > 0) return "pos";
  if (value < -1) return "neg";
  return "";
}

function chip(element, label, colour, on) {
  element.textContent = label;
  element.style.color = on ? colour : "var(--dim)";
  element.style.borderColor = on ? colour : "var(--grid)";
  element.style.background = on ? rgba(colour, 0.12) : "transparent";
}

function updateHud() {
  const frame = FRAMES[clamp(view.index, 0, FRAMES.length-1)];
  H("h-step").textContent = frame.step + " / " + (FRAMES.length - 1);
  /* The grid rooms sit on whole cells; Room 4 flies between them, so a raw
     float would print seventeen digits into the HUD. */
  const cell = (value) => (Number.isInteger(value) ? value : value.toFixed(1));
  H("h-pos").textContent = "r" + cell(frame.row) + " c" + cell(frame.col);
  H("h-action").textContent = frame.action_name || "—";
  H("h-actual").textContent = frame.actual_direction_name || "—";
  H("h-actual").className = "hud-val " + (frame.slipped ? "warn" : "");
  H("h-reward").textContent = (frame.reward >= 0 ? "+" : "") + frame.reward.toFixed(0);
  H("h-reward").className = "hud-val " + toneFor(frame.reward);
  H("h-total").textContent = (frame.cumulative_reward >= 0 ? "+" : "")
    + frame.cumulative_reward.toFixed(0);
  H("h-total").className = "hud-val " + toneFor(frame.cumulative_reward);
  H("h-prev").textContent = frame.previous_direction_name || "NONE";
  H("h-event").textContent = frame.event || "—";

  /* Count what has happened up to this point in the recording. The three
     counters are named by the scene, so the same display serves both rooms:
     Room 1 counts laser hits and teleports, Room 2 pit falls and lost bridges. */
  let failures = 0, extras = 0;
  for (let i = 0; i <= view.index && i < FRAMES.length; i++) {
    if (FRAMES[i].laser_hit || FRAMES[i].pit_fall) failures++;
    if (FRAMES[i].used_teleport || FRAMES[i].bridge_collapsed) extras++;
  }
  const meta = SCENE.meta;
  chip(H("c-battery"),
       frame.has_item ? "⚡ " + meta.itemLabel + " held"
                      : meta.itemLabel + ": none",
       P.warning, !!frame.has_item);
  chip(H("c-laser"), meta.failLabel + ": " + failures, P.danger, failures > 0);
  chip(H("c-tele"), meta.extraLabel + ": " + extras, P.purple, extras > 0);

  const status = frame.status || "Standing by";
  const good = status === "Escaped";
  const bad = !!frame.pit_fall;
  chip(H("c-status"), status,
       good ? P.success : (bad ? P.danger : P.cyan), true);
  H("p-status").textContent = good ? "CLEARED" : meta.systemStatus;
  H("p-status").style.color = good ? P.success : (bad ? P.danger : P.cyan);

  const share = FRAMES.length > 1
    ? (view.index + view.t) / (FRAMES.length - 1) : 1;
  H("b-track").style.width = (clamp(share, 0, 1) * 100) + "%";

  H("b-play").textContent = view.playing ? "‖ Pause" : "▶ Play";
  H("b-play").classList.toggle("on", view.playing);
  H("b-back").disabled = view.index <= 0;
  H("b-fwd").disabled = view.index >= FRAMES.length - 1;
}

/* =====================================================================
   The clock
   ===================================================================== */
let lastTime = 0;

function tick(time) {
  now = time;
  const elapsed = Math.min(64, time - (lastTime || time));
  lastTime = time;

  if (view.playing && FRAMES.length > 1) {
    const duration = FRAME_MS / SPEEDS[view.speedStep];
    view.t += elapsed / duration;
    while (view.t >= 1) {
      view.t -= 1;
      if (view.index < FRAMES.length - 1) {
        view.index++;
        persist();
      } else {
        view.t = 0; view.playing = false; break;
      }
    }
  }

  if (view.index > 0 || view.t > 0) {
    fireEffects(FRAMES[clamp(view.index, 0, FRAMES.length-1)], view.index);
  }

  /* let the impact effects fade out */
  shake *= 0.86;
  vignette *= 0.93;

  if (view.follow) centreOnRobot();

  updateParticles();
  draw();
  updateHud();
  requestAnimationFrame(tick);
}

function centreOnRobot() {
  const frame = FRAMES[clamp(view.index, 0, FRAMES.length-1)];
  const pose = robotPose(frame, view.t);
  const [rr, cc] = rotatePoint(pose.row, pose.col);
  /* work out where the robot currently lands, then ease the pan so it centres */
  const saveX = view.panX, saveY = view.panY;
  view.panX = 0; view.panY = 0;
  const point = project(rr + 0.5, cc + 0.5, 0);
  view.panX = saveX; view.panY = saveY;
  const wantX = cssWidth/2 - point[0], wantY = cssHeight/2 - point[1];
  view.panX += (wantX - view.panX) * 0.08;
  view.panY += (wantY - view.panY) * 0.08;
}

/* =====================================================================
   Controls
   ===================================================================== */
function setFrame(index) {
  view.index = clamp(index, 0, FRAMES.length - 1);
  view.t = 0;
  lastEffectFrame = -1;
  persist();
}

H("b-play").onclick = () => {
  if (!view.playing && view.index >= FRAMES.length - 1) setFrame(0);
  view.playing = !view.playing;
  persist();
};
H("b-restart").onclick = () => { setFrame(0); particles.length = 0; };
H("b-back").onclick = () => { view.playing = false; setFrame(view.index - 1); };
H("b-fwd").onclick = () => { view.playing = false; setFrame(view.index + 1); };
H("b-speed").onclick = () => {
  view.speedStep = (view.speedStep + 1) % SPEEDS.length;
  H("b-speed").textContent = SPEEDS[view.speedStep].toFixed(1) + "×";
  persist();
};
H("b-camera").onchange = event => {
  view.camera = event.target.value; view.panX = 0; view.panY = 0; persist();
};
H("b-quality").onchange = event => {
  view.quality = event.target.value; seedDust(); persist();
};
H("b-follow").onclick = () => {
  view.follow = !view.follow;
  H("b-follow").classList.toggle("on", view.follow);
  if (!view.follow) { view.panX = 0; view.panY = 0; }
  persist();
};
H("b-rotl").onclick = () => { view.rotation = (view.rotation + 3) & 3; persist(); };
H("b-rotr").onclick = () => { view.rotation = (view.rotation + 1) & 3; persist(); };
H("b-zoomin").onclick = () => { view.zoom = clamp(view.zoom * 1.18, 0.5, 3); persist(); };
H("b-zoomout").onclick = () => { view.zoom = clamp(view.zoom / 1.18, 0.5, 3); persist(); };
H("b-reset").onclick = () => {
  view.zoom = 1; view.panX = 0; view.panY = 0; view.rotation = 0;
  view.follow = false; H("b-follow").classList.remove("on"); persist();
};

/* Room 4's overlay toggles. Hidden in the grid rooms, which have no wind. */
["wind", "trail", "vectors"].forEach(name => {
  const key = "show" + name.charAt(0).toUpperCase() + name.slice(1);
  const button = H("b-" + name);
  if (!CONT) { button.style.display = "none"; return; }
  button.classList.toggle("on", view[key]);
  button.onclick = () => {
    view[key] = !view[key];
    button.classList.toggle("on", view[key]);
    persist();
  };
});

/* drag to pan, wheel to zoom */
let dragging = false, dragX = 0, dragY = 0;
canvas.addEventListener("pointerdown", event => {
  dragging = true; dragX = event.clientX; dragY = event.clientY;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener("pointermove", event => {
  if (!dragging) return;
  view.panX += event.clientX - dragX;
  view.panY += event.clientY - dragY;
  dragX = event.clientX; dragY = event.clientY;
  view.follow = false; H("b-follow").classList.remove("on");
});
canvas.addEventListener("pointerup", event => {
  dragging = false; canvas.classList.remove("dragging"); persist();
});
canvas.addEventListener("wheel", event => {
  event.preventDefault();
  view.zoom = clamp(view.zoom * (event.deltaY < 0 ? 1.08 : 1/1.08), 0.5, 3);
}, { passive: false });

/* =====================================================================
   Legend and nameplate
   ===================================================================== */
const LEGEND_COLOURS = {
  start: P.cyanDim, exit: P.success, wall: P.metal, floor: shade(P.backgroundSoft, 0.1),
  weak_ice: P.iceDeep, strong_ice: P.ice, oil: P.oil, laser: P.danger,
  battery: P.warning, teleport: P.purple, door: P.metalLight,
  /* Room 2 */
  bridge: P.bridge, collapsing_bridge: P.collapsing, pit: P.shaft,
  keycard: P.warning, platform: P.bridgeLight, exit_door: P.success,
  /* Room 3 */
  generator_a: "#2E7FB8", generator_b: "#2E9FA8", generator_c: "#2EB88A",
  reactor_door: P.collapsing, hazard: P.danger, sliding_door: P.metalLight,
  /* Room 4 */
  obstacle: P.metal, fan: P.cyan, wind: P.cyanDim,
  /* Room 5 */
  shelf: P.metal, crate: "#6A5433", terminal: P.warning,
  conveyor: shade(P.metal, -0.18), charger: P.cyanDim
};

(function buildLegend() {
  const holder = document.getElementById("legend");
  SCENE.legend.forEach(([kind, name]) => {
    const item = document.createElement("span");
    item.className = "legend-item";
    const swatch = document.createElement("span");
    swatch.className = "swatch";
    swatch.style.background = LEGEND_COLOURS[kind] || P.metal;
    item.appendChild(swatch);
    item.appendChild(document.createTextNode(name));
    item.title = name;
    holder.appendChild(item);
  });
})();

H("p-sector").textContent = SCENE.meta.sector;
H("p-title").textContent = "ROOM " + SCENE.meta.roomNumber + " — " + SCENE.meta.title;
H("p-subtitle").textContent = SCENE.meta.subtitle;
H("p-status").textContent = SCENE.meta.systemStatus;
if (SCENE.meta.speedLabel) H("h-prev-label").textContent = SCENE.meta.speedLabel;
H("b-camera").value = view.camera;
H("b-quality").value = view.quality;
H("b-speed").textContent = SPEEDS[view.speedStep].toFixed(1) + "×";
H("b-follow").classList.toggle("on", view.follow);

if (REDUCED) {
  notice.hidden = false;
  notice.textContent = "Reduced-motion is on in your system settings, so "
    + "animation effects are switched off. Use the step buttons to move through "
    + "the episode.";
}

/* =====================================================================
   Go
   ===================================================================== */
window.addEventListener("resize", resize);
resize();
seedDust();
requestAnimationFrame(tick);
</script>
