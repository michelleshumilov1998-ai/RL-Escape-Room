<!-- The isometric chamber renderer for PROJECT R-5.

     Everything here is self-contained: no external scripts, stylesheets, fonts
     or images, so the page works offline and inside a strict sandbox.

     Python hands this file a scene dictionary in place of __SCENE__ and does not
     take part in the animation.  The clock lives in here, which is why playing a
     replay never causes a Streamlit rerun.
-->
<style>
  :root {
    --bg: #08111F; --soft: #101C2E; --panel: #14233A;
    --metal: #3B4658; --grid: #263A55;
    --cyan: #38D9FF; --purple: #8B5CF6; --danger: #FF3B5C;
    --warning: #FFC857; --success: #32E875;
    --text: #EAF2FF; --muted: #9FB0C7; --dim: #6C7C93;
    --mono: "JetBrains Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
    --sans: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  #root {
    font-family: var(--sans); color: var(--text);
    border: 1px solid var(--metal); border-radius: 16px;
    background: linear-gradient(180deg, #1B2E4A 0%, var(--panel) 100%);
    box-shadow: 0 6px 22px rgba(0,0,0,.45), inset 0 1px 0 rgba(85,98,122,.3);
    overflow: hidden; position: relative;
  }
  #root::after {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, rgba(56,217,255,.5) 18%,
                var(--cyan) 50%, rgba(56,217,255,.5) 82%, transparent);
  }

  /* ---- nameplate ---- */
  .plate {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; padding: 10px 14px 8px 14px; border-bottom: 1px solid var(--grid);
    flex-wrap: wrap;
  }
  .sector {
    font-family: var(--mono); font-size: .66rem; letter-spacing: .24em;
    color: var(--cyan); text-transform: uppercase;
  }
  .title { font-size: .95rem; font-weight: 700; letter-spacing: .06em; }
  .subtitle {
    font-family: var(--mono); font-size: .62rem; letter-spacing: .16em;
    color: var(--warning); text-transform: uppercase;
  }
  .lights { display: inline-flex; gap: 5px; margin-left: 8px; }
  .lamp {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; box-shadow: 0 0 7px currentColor;
  }
  .lamp.blink { animation: blink 2.4s ease-in-out infinite; }
  @keyframes blink { 0%,72%,100% { opacity:1 } 84% { opacity:.15 } }

  /* ---- stage ---- */
  .stage-wrap { position: relative; background:
      radial-gradient(70% 60% at 50% 8%, rgba(56,217,255,.055), transparent 70%),
      linear-gradient(180deg, #0A1526, #060D18); }
  canvas { display: block; width: 100%; touch-action: none; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  /* ---- heads-up display over the chamber ---- */
  .hud {
    position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column;
    gap: 5px; pointer-events: none; font-family: var(--mono); font-size: .64rem;
    letter-spacing: .05em;
  }
  .hud-box {
    background: rgba(8,17,31,.74); border: 1px solid var(--grid);
    border-radius: 7px; padding: 5px 9px; backdrop-filter: blur(3px);
    display: flex; gap: 10px; align-items: baseline;
  }
  .hud-key { color: var(--dim); text-transform: uppercase; }
  .hud-val { color: var(--text); }
  .hud-val.pos { color: var(--success); } .hud-val.neg { color: var(--danger); }
  .hud-val.warn { color: var(--warning); } .hud-val.info { color: var(--cyan); }
  .hud-event {
    position: absolute; bottom: 10px; left: 10px; right: 10px;
    font-family: var(--mono); font-size: .66rem; pointer-events: none;
    background: rgba(8,17,31,.74); border: 1px solid var(--grid);
    border-radius: 7px; padding: 6px 10px; display: flex; gap: 10px;
    align-items: center; backdrop-filter: blur(3px);
  }
  .chip {
    font-family: var(--mono); font-size: .58rem; letter-spacing: .12em;
    text-transform: uppercase; border: 1px solid; border-radius: 999px;
    padding: 1px 8px; white-space: nowrap;
  }

  /* ---- controls ---- */
  .controls {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    padding: 9px 12px; border-top: 1px solid var(--grid); background: rgba(8,17,31,.5);
  }
  button.ctl, select.ctl {
    font-family: var(--mono); font-size: .62rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text);
    background: linear-gradient(180deg, #1B2E4A, var(--panel));
    border: 1px solid var(--metal); border-radius: 6px;
    padding: 5px 9px; cursor: pointer;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  button.ctl:hover, select.ctl:hover {
    border-color: rgba(56,217,255,.55); box-shadow: 0 0 14px rgba(56,217,255,.25);
  }
  button.ctl.on { border-color: rgba(56,217,255,.65); color: var(--cyan);
                  background: linear-gradient(180deg, rgba(56,217,255,.14), var(--panel)); }
  button.ctl:disabled { color: var(--dim); border-color: var(--grid); cursor: default;
                        box-shadow: none; }
  .ctl-label { font-family: var(--mono); font-size: .58rem; letter-spacing: .16em;
               color: var(--dim); text-transform: uppercase; margin-left: 6px; }
  .spacer { flex: 1 1 auto; }
  .track {
    flex: 1 1 120px; min-width: 90px; height: 4px; border-radius: 3px;
    background: var(--grid); position: relative; overflow: hidden;
  }
  .track-fill { position: absolute; inset: 0 auto 0 0; background: var(--cyan);
                box-shadow: 0 0 8px rgba(56,217,255,.6); width: 0; }

  /* ---- legend ---- */
  .legend {
    display: flex; flex-wrap: wrap; gap: 5px 12px; padding: 8px 12px 11px 12px;
    border-top: 1px solid var(--grid);
  }
  .legend-item {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .64rem; color: var(--muted);
  }
  .swatch { width: 11px; height: 11px; border-radius: 3px; border: 1px solid rgba(0,0,0,.4); }

  .notice {
    margin: 10px 12px; padding: 8px 11px; border-radius: 8px; font-size: .7rem;
    border: 1px solid rgba(255,200,87,.45); background: rgba(255,200,87,.1);
    color: var(--warning); font-family: var(--mono);
  }
  @media (prefers-reduced-motion: reduce) { .lamp.blink { animation: none; } }
  @media (max-width: 620px) {
    .hud { font-size: .58rem; } .plate { padding: 8px 10px; }
  }
</style>

<div id="root">
  <div class="plate">
    <div>
      <div class="sector">
        <span id="p-sector"></span>
        <span class="lights">
          <span class="lamp blink" style="color:#38D9FF"></span>
          <span class="lamp" style="color:#FFC857"></span>
          <span class="lamp" style="color:#FF3B5C"></span>
        </span>
      </div>
      <div class="title" id="p-title"></div>
    </div>
    <div style="text-align:right">
      <div class="subtitle" id="p-subtitle"></div>
      <div class="sector" style="color:var(--muted)">SYSTEM STATUS:
        <span id="p-status" style="color:var(--cyan)"></span></div>
    </div>
  </div>

  <div class="stage-wrap">
    <canvas id="stage"></canvas>
    <div class="hud">
      <div class="hud-box"><span class="hud-key">Step</span><span class="hud-val" id="h-step">0</span>
        <span class="hud-key">Pos</span><span class="hud-val info" id="h-pos">—</span></div>
      <div class="hud-box"><span class="hud-key">Action</span><span class="hud-val" id="h-action">—</span>
        <span class="hud-key">Actual</span><span class="hud-val" id="h-actual">—</span></div>
      <div class="hud-box"><span class="hud-key">Reward</span><span class="hud-val" id="h-reward">0</span>
        <span class="hud-key">Total</span><span class="hud-val" id="h-total">0</span></div>
      <div class="hud-box"><span class="hud-key" id="h-prev-label">Prev dir</span><span class="hud-val" id="h-prev">NONE</span></div>
    </div>
    <div class="hud-event">
      <span id="h-event" style="color:var(--muted)">—</span>
      <span class="spacer"></span>
      <span class="chip" id="c-battery"></span>
      <span class="chip" id="c-laser"></span>
      <span class="chip" id="c-tele"></span>
      <span class="chip" id="c-status"></span>
    </div>
  </div>

  <div class="controls">
    <button class="ctl" id="b-restart" title="Back to the first frame">⏮</button>
    <button class="ctl" id="b-back" title="One step back">◀❘</button>
    <button class="ctl" id="b-play" title="Play or pause">▶ Play</button>
    <button class="ctl" id="b-fwd" title="One step forward">❘▶</button>
    <button class="ctl" id="b-speed" title="Playback speed">1.0×</button>
    <div class="track" title="Progress through the episode"><div class="track-fill" id="b-track"></div></div>
    <span class="ctl-label">View</span>
    <select class="ctl" id="b-camera" title="Camera mode">
      <option value="iso">3D view</option>
      <option value="tactical">Tactical</option>
      <option value="top">Top-down</option>
    </select>
    <span class="ctl-label">Quality</span>
    <select class="ctl" id="b-quality" title="Visual quality">
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <button class="ctl" id="b-follow" title="Keep the camera centred on R-5">◎ Follow</button>
    <button class="ctl" id="b-rotl" title="Rotate the chamber left">⟲</button>
    <button class="ctl" id="b-rotr" title="Rotate the chamber right">⟳</button>
    <button class="ctl" id="b-zoomin" title="Zoom in">＋</button>
    <button class="ctl" id="b-zoomout" title="Zoom out">－</button>
    <button class="ctl" id="b-reset" title="Reset the camera">⌂ Reset</button>
  <button class="ctl on" id="b-wind" title="Show the airflow field">≈ Wind</button>
  <button class="ctl on" id="b-trail" title="Show the flight path">∿ Trail</button>
  <button class="ctl on" id="b-vectors" title="Show velocity, thrust and wind vectors">⟶ Vectors</button>
  </div>

  <div class="legend" id="legend"></div>
  <div class="notice" id="notice" hidden></div>
</div>

<script>
"use strict";
const SCENE = __SCENE__;

/* =====================================================================
   Setup
   ===================================================================== */
const canvas = document.getElementById("stage");
const notice = document.getElementById("notice");
let ctx = null;
try { ctx = canvas.getContext("2d"); } catch (err) { ctx = null; }

const P = SCENE.palette;
const GRID = SCENE.grid;
const ROWS = GRID.rows, COLS = GRID.cols;
const FRAMES = SCENE.frames;
const OPTIONS = SCENE.options;
const DELTAS = SCENE.deltas;
const DIR_NAMES = SCENE.directionNames;

const REDUCED = window.matchMedia
  && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Camera presets.  Every mode keeps the same chamber, only the angle changes.
   Wall height is deliberately kept below half a tile's depth: a taller block
   looks more dramatic but hides the row behind it, and hiding a hazard — or
   R-5 itself — is worse than looking flat. */
const CAMERAS = {
  iso:      { tileW: 62, tileH: 31, wall: 15, floor: 6, skew: true,  label: "3D view" },
  tactical: { tileW: 56, tileH: 42, wall: 19, floor: 6, skew: true,  label: "Tactical" },
  top:      { tileW: 40, tileH: 40, wall: 0,  floor: 0, skew: false, label: "Top-down" }
};

/* Quality gates.  These only affect decoration; the recorded episode is
   identical at every setting. */
const QUALITY = {
  High:   { particles: 1.0, shadows: true,  reflections: true,  decor: true,  dust: 26 },
  Medium: { particles: 0.5, shadows: true,  reflections: false, decor: true,  dust: 10 },
  Low:    { particles: 0.0, shadows: false, reflections: false, decor: false, dust: 0 }
};

const FRAME_MS = 430;          /* how long one step takes at 1.0x */
const SPEEDS = [0.5, 1.0, 2.0, 4.0];

/* Playback and camera state, restored below if this scene was already running. */
const view = {
  index: 0, t: 0, playing: OPTIONS.autoplay && !REDUCED && FRAMES.length > 1,
  speedStep: 1, camera: OPTIONS.camera in CAMERAS ? OPTIONS.camera : "iso",
  quality: OPTIONS.quality in QUALITY ? OPTIONS.quality : "High",
  follow: !!OPTIONS.follow, rotation: 0, zoom: 1, panX: 0, panY: 0,
  /* Room 4 overlays. Harmless in the grid rooms, which never read them. */
  showWind: true, showTrail: true, showVectors: true
};

/* ---- resuming after a Streamlit rerun -------------------------------
   The iframe is rebuilt whenever the page reruns.  The position is stored
   under `episodeId`, which depends only on the map and the recorded frames.
   So changing a view setting keeps the playback position, while a genuinely
   new episode starts from the beginning.                                  */
const STORE_KEY = "r5-view-" + SCENE.episodeId;
try {
  const saved = JSON.parse(sessionStorage.getItem(STORE_KEY) || "null");
  if (saved) Object.assign(view, saved);
} catch (err) { /* storage unavailable: start fresh, which is fine */ }

/* Play/pause and speed can also be driven from the Streamlit controls.  Those
   arrive in `options` and win over whatever was stored, so pressing Pause on
   the page really does pause — without losing the current step. */
view.playing = !!OPTIONS.autoplay && !REDUCED && FRAMES.length > 1;
const requestedSpeed = SPEEDS.indexOf(OPTIONS.speed);
if (requestedSpeed >= 0) view.speedStep = requestedSpeed;

function persist() {
  try {
    sessionStorage.setItem(STORE_KEY, JSON.stringify({
      index: view.index, t: 0, playing: view.playing, speedStep: view.speedStep,
      camera: view.camera, quality: view.quality, follow: view.follow,
      rotation: view.rotation, zoom: view.zoom, panX: view.panX, panY: view.panY
    }));
  } catch (err) { /* nothing to do */ }
}

if (!ctx) {
  notice.hidden = false;
  notice.textContent = "This browser could not open a 2D canvas, so the 3D "
    + "chamber is unavailable. The top-down analysis view still works.";
}

/* =====================================================================
   Small helpers
   ===================================================================== */
function hexToRgb(hex) {
  const clean = hex.replace("#", "");
  return [parseInt(clean.slice(0,2),16), parseInt(clean.slice(2,4),16),
          parseInt(clean.slice(4,6),16)];
}
function rgba(hex, alpha) {
  const [r,g,b] = hexToRgb(hex);
  return "rgba(" + r + "," + g + "," + b + "," + alpha + ")";
}
function mix(hexA, hexB, amount) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const out = a.map((value, i) => Math.round(value + (b[i]-value)*amount));
  return "rgb(" + out.join(",") + ")";
}
function shade(hex, amount) {
  return amount < 0 ? mix(hex, "#000000", -amount) : mix(hex, "#FFFFFF", amount);
}
function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2, 2)/2; }

/* A stable pseudo-random number per cell, so decoration never flickers. */
function cellNoise(row, col, salt) {
  const value = Math.sin((row+1)*127.1 + (col+1)*311.7 + salt*74.7) * 43758.5453;
  return value - Math.floor(value);
}

function tileAt(row, col) {
  if (row < 0 || col < 0 || row >= ROWS || col >= COLS) return "wall";
  return GRID.tiles[row][col];
}
function isWall(row, col) { return tileAt(row, col) === "wall"; }

/* =====================================================================
   Camera and projection
   ===================================================================== */
let cssWidth = 900, cssHeight = 520;

function resize() {
  const ratio = window.devicePixelRatio || 1;
  cssWidth = canvas.parentElement.clientWidth || 900;
  cssHeight = Math.round(clamp(cssWidth * 0.60, 340, 560));
  canvas.style.height = cssHeight + "px";
  canvas.width = Math.round(cssWidth * ratio);
  canvas.height = Math.round(cssHeight * ratio);
  if (ctx) { ctx.setTransform(ratio, 0, 0, ratio, 0, 0); }
}

/* Rotating the chamber is done by relabelling the cells, which keeps the
   isometric boxes perfectly axis-aligned at every angle. */
function rotate(row, col) {
  const lastRow = ROWS - 1, lastCol = COLS - 1;
  switch (view.rotation & 3) {
    case 1:  return [col, lastRow - row];
    case 2:  return [lastRow - row, lastCol - col];
    case 3:  return [lastCol - col, row];
    default: return [row, col];
  }
}

/* The same relabelling as `rotate`, but for a point that may sit between cells —
   a robot part way through a move, or a guard being interpolated. */
function rotatePoint(row, col) {
  const lastRow = ROWS - 1, lastCol = COLS - 1;
  switch (view.rotation & 3) {
    case 1:  return [col, lastRow - row];
    case 2:  return [lastRow - row, lastCol - col];
    case 3:  return [lastCol - col, row];
    default: return [row, col];
  }
}

function autoZoom() {
  const cam = CAMERAS[view.camera];
  const spanX = cam.skew ? (ROWS + COLS) * cam.tileW / 2 : COLS * cam.tileW;
  const spanY = cam.skew ? (ROWS + COLS) * cam.tileH / 2 + cam.wall : ROWS * cam.tileH;
  return Math.min((cssWidth - 60) / spanX, (cssHeight - 70) / spanY);
}

/* Cell coordinates -> screen pixels.  `z` lifts a point off the floor. */
function project(row, col, z) {
  const cam = CAMERAS[view.camera];
  const scale = autoZoom() * view.zoom;
  const [rr, cc] = [row, col];
  let x, y;
  if (cam.skew) {
    x = (cc - rr) * cam.tileW / 2;
    y = (cc + rr) * cam.tileH / 2 - (z || 0);
  } else {
    x = (cc - (COLS - 1) / 2) * cam.tileW;
    y = (rr - (ROWS - 1) / 2) * cam.tileH - (z || 0) * 0.35;
  }
  let originX = cssWidth / 2, originY = cssHeight / 2;
  if (cam.skew) {
    originY = cssHeight / 2 - ((ROWS + COLS) / 2) * cam.tileH / 2 * scale
              + cssHeight * 0.06;
    originX = cssWidth / 2 - ((COLS - ROWS) / 2) * cam.tileW / 2 * scale;
  }
  return [originX + x * scale + view.panX, originY + y * scale + view.panY];
}

function scaleNow() { return autoZoom() * view.zoom; }

/* A size in pixels that grows with the camera, but never shrinks below what is
   still legible.  Every prop and line width goes through this, so zooming keeps
   the whole chamber in proportion. */
function px(base, minimum) {
  return Math.max(minimum === undefined ? 1 : minimum, base * scaleNow());
}

/* The four corners of one floor tile, as screen points. */
function tileQuad(row, col, z, inset) {
  const pad = inset || 0;
  return [
    project(row + pad,     col + pad,     z),
    project(row + pad,     col + 1 - pad, z),
    project(row + 1 - pad, col + 1 - pad, z),
    project(row + 1 - pad, col + pad,     z)
  ];
}

function fillPath(points, fill, stroke, lineWidth) {
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth || 1; ctx.stroke(); }
}

/* =====================================================================
   Materials
   ===================================================================== */
function floorMaterial(kind, row, col) {
  switch (kind) {
    case "weak_ice":   return { top: P.iceDeep, side: shade(P.iceDeep, -0.45), gloss: 0.55 };
    case "strong_ice": return { top: P.ice,     side: shade(P.ice, -0.45),     gloss: 0.8 };
    case "oil":        return { top: P.oil,     side: shade(P.oil, -0.3),      gloss: 0.95 };
    case "laser":      return { top: shade(P.background, 0.06), side: shade(P.background, -0.2), gloss: 0.1 };
    case "start":      return { top: shade(P.cyanDim, -0.1), side: shade(P.cyanDim, -0.55), gloss: 0.3 };
    case "exit":       return { top: shade(P.success, -0.45), side: shade(P.success, -0.7), gloss: 0.25 };
    case "exit_door":  return { top: shade(P.success, -0.5), side: shade(P.success, -0.72), gloss: 0.2 };
    case "teleport":   return { top: shade(P.purple, -0.55), side: shade(P.purple, -0.75), gloss: 0.4 };
    case "door":       return { top: shade(P.metalLight, -0.25), side: shade(P.metal, -0.35), gloss: 0.2 };
    /* ---- Room 2: the industrial bridge sector ---- */
    case "bridge":     return { top: P.bridge, side: shade(P.bridge, -0.42), gloss: 0.18 };
    case "collapsing_bridge":
                       return { top: shade(P.collapsing, 0.05), side: shade(P.collapsing, -0.45), gloss: 0.15 };
    case "platform":   return { top: P.bridgeLight, side: shade(P.bridgeLight, -0.45), gloss: 0.22 };
    case "keycard":    return { top: shade(P.warning, -0.55), side: shade(P.warning, -0.75), gloss: 0.3 };
    /* ---- Room 3: the reactor control chamber ---- */
    case "generator_a":
    case "generator_b":
    case "generator_c":
                       return { top: shade(P.metal, -0.08), side: shade(P.metal, -0.5), gloss: 0.25 };
    case "reactor_door":
                       return { top: shade(P.collapsing, -0.2), side: shade(P.collapsing, -0.6), gloss: 0.2 };
    case "hazard":     return { top: shade(P.background, 0.08), side: shade(P.background, -0.25), gloss: 0.1 };
    case "sliding_door":
                       return { top: shade(P.metalLight, -0.3), side: shade(P.metal, -0.45), gloss: 0.2 };
    /* ---- Room 5: the adaptive storage facility ---- */
    case "shelf":      return { top: shade(P.metal, 0.04), side: shade(P.metal, -0.42), gloss: 0.16 };
    case "crate":      return { top: "#6A5433", side: shade("#6A5433", -0.42), gloss: 0.14 };
    case "terminal":   return { top: shade(P.warning, -0.5), side: shade(P.warning, -0.72), gloss: 0.3 };
    case "conveyor":   return { top: shade(P.metal, -0.18), side: shade(P.metal, -0.5), gloss: 0.25 };
    case "charger":    return { top: shade(P.cyanDim, -0.25), side: shade(P.cyanDim, -0.6), gloss: 0.3 };
    default: {
      /* Ordinary floor panels vary very slightly so the seams read as panels. */
      const jitter = (cellNoise(row, col, 3) - 0.5) * 0.05;
      return { top: shade(P.backgroundSoft, 0.10 + jitter),
               side: shade(P.backgroundSoft, -0.35), gloss: 0.12 };
    }
  }
}

/* =====================================================================
   Drawing the chamber
   ===================================================================== */
function drawFloorTile(row, col, kind) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const material = floorMaterial(kind, row, col);
  const thickness = cam.floor * scale;
  const top = tileQuad(row, col, 0);

  /* the slab side faces, which give the floor visible thickness */
  if (thickness > 0.6) {
    const lower = top.map(point => [point[0], point[1] + thickness]);
    fillPath([top[3], top[2], lower[2], lower[3]], shade(material.side, -0.15));
    fillPath([top[2], top[1], lower[1], lower[2]], material.side);
  }

  fillPath(top, material.top, rgba(P.gridLine, 0.85), 1);

  /* a soft specular streak on ice and oil */
  if (material.gloss > 0.35 && QUALITY[view.quality].reflections) {
    const mid = tileQuad(row, col, 0, 0.22);
    ctx.save();
    ctx.globalAlpha = material.gloss * 0.30;
    fillPath(mid, "#FFFFFF");
    ctx.restore();
  }

  /* panel seams */
  if (kind === "floor" && QUALITY[view.quality].decor && cam.skew) {
    ctx.save();
    ctx.globalAlpha = 0.25;
    const a = project(row + 0.5, col, 0), b = project(row + 0.5, col + 1, 0);
    ctx.strokeStyle = rgba(P.gridLine, 0.9); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    ctx.restore();
  }
}

function drawWallBlock(row, col) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const height = cam.wall * scale;

  if (height < 1) {   /* top-down mode: a flat metal plate */
    fillPath(tileQuad(row, col, 0), P.metal, rgba(P.gridLine, 0.9), 1);
    return;
  }

  const top = tileQuad(row, col, cam.wall * scale);
  const base = tileQuad(row, col, 0);

  /* the two visible side faces, lit differently so the block reads as solid */
  fillPath([top[3], top[2], base[2], base[3]], shade(P.metal, -0.34));
  fillPath([top[2], top[1], base[1], base[2]], shade(P.metal, -0.14));
  fillPath(top, shade(P.metal, 0.16), rgba(P.metalLight, 0.5), 1);

  if (!QUALITY[view.quality].decor) return;

  /* pipes and maintenance panels bolted to the wall faces */
  const noise = cellNoise(row, col, 1);
  if (noise > 0.62) {
    ctx.save();
    ctx.globalAlpha = 0.5; ctx.lineWidth = px(2.4, 1.4);
    ctx.strokeStyle = shade(P.metalLight, -0.1);
    const a = project(row + 0.5, col + 1, cam.wall * scale * 0.72);
    const b = project(row + 1, col + 1, cam.wall * scale * 0.72);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    ctx.restore();
  }
  if (noise < 0.2) {   /* a small blinking terminal light */
    const point = project(row + 1, col + 0.5, cam.wall * scale * 0.55);
    const pulse = REDUCED ? 0.7 : 0.45 + 0.45 * Math.sin(now / 420 + noise * 12);
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = P.cyan;
    ctx.fillRect(point[0] - 2, point[1] - 2, 4, 4);
    ctx.restore();
  }
}

function drawLaser(row, col) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const height = Math.max(cam.wall, 18) * scale;

  /* Which way does the beam run?  Along whichever axis has walls to shoot from. */
  const horizontal = isWall(row, col - 1) || isWall(row, col + 1);
  const flicker = REDUCED ? 1 : 0.82 + 0.18 * Math.sin(now / 90 + row * 3 + col);

  /* the hazard floor plate */
  ctx.save();
  ctx.globalAlpha = 0.35 * flicker;
  fillPath(tileQuad(row, col, 0, 0.05), P.danger);
  ctx.restore();

  /* the beam itself, as a translucent slab standing on the tile */
  const lowA = horizontal ? project(row + 0.5, col,     6 * scale)
                          : project(row,       col + 0.5, 6 * scale);
  const lowB = horizontal ? project(row + 0.5, col + 1, 6 * scale)
                          : project(row + 1,   col + 0.5, 6 * scale);
  const highA = horizontal ? project(row + 0.5, col,     height * 0.78)
                           : project(row,       col + 0.5, height * 0.78);
  const highB = horizontal ? project(row + 0.5, col + 1, height * 0.78)
                           : project(row + 1,   col + 0.5, height * 0.78);

  ctx.save();
  ctx.globalAlpha = 0.30 * flicker;
  fillPath([lowA, lowB, highB, highA], P.danger);
  ctx.restore();

  /* the bright core line */
  ctx.save();
  ctx.globalAlpha = flicker;
  ctx.strokeStyle = "#FF8FA3";
  ctx.lineWidth = px(2.2, 1.6);
  ctx.shadowColor = P.danger; ctx.shadowBlur = 14;
  const midA = horizontal ? project(row + 0.5, col,     height * 0.42)
                          : project(row,       col + 0.5, height * 0.42);
  const midB = horizontal ? project(row + 0.5, col + 1, height * 0.42)
                          : project(row + 1,   col + 0.5, height * 0.42);
  ctx.beginPath(); ctx.moveTo(midA[0], midA[1]); ctx.lineTo(midB[0], midB[1]); ctx.stroke();
  ctx.restore();

  /* emitter housings on the walls at each end */
  [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([dr, dc]) => {
    if ((horizontal && dr !== 0) || (!horizontal && dc !== 0)) return;
    if (!isWall(row + dr, col + dc)) return;
    const point = project(row + 0.5 + dr * 0.42, col + 0.5 + dc * 0.42, height * 0.42);
    const size = px(6, 3);
    ctx.save();
    ctx.fillStyle = shade(P.metal, 0.2);
    ctx.fillRect(point[0] - size/2, point[1] - size/2, size, size);
    ctx.globalAlpha = flicker; ctx.fillStyle = P.danger;
    ctx.shadowColor = P.danger; ctx.shadowBlur = 9;
    ctx.beginPath(); ctx.arc(point[0], point[1], size * 0.32, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

function drawTeleportPad(row, col, active) {
  const scale = scaleNow();
  const spin = REDUCED ? 0 : now / 620;
  const pulse = REDUCED ? 0.7 : 0.55 + 0.45 * Math.sin(now / 340);

  ctx.save();
  ctx.globalAlpha = 0.55 * pulse;
  fillPath(tileQuad(row, col, 1, 0.10), P.purple);
  ctx.restore();

  /* a rotating ring of markers around the pad */
  for (let i = 0; i < 6; i++) {
    const angle = spin + i * Math.PI / 3;
    const point = project(row + 0.5 + Math.sin(angle) * 0.32,
                          col + 0.5 + Math.cos(angle) * 0.32, 3);
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = "#C9AFFF"; ctx.shadowColor = P.purple; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(point[0], point[1], px(2.2, 1.4), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  /* the energy column, brighter while the teleporter is firing */
  const strength = active ? 1 : 0.32;
  const base = project(row + 0.5, col + 0.5, 2);
  const top = project(row + 0.5, col + 0.5, (active ? 62 : 30) * scale);
  const gradient = ctx.createLinearGradient(base[0], base[1], top[0], top[1]);
  gradient.addColorStop(0, rgba(P.purple, 0.55 * strength));
  gradient.addColorStop(1, rgba(P.purple, 0));
  ctx.save();
  ctx.strokeStyle = gradient;
  ctx.lineWidth = px(13, 6) * (active ? 1.6 : 1);
  ctx.beginPath(); ctx.moveTo(base[0], base[1]); ctx.lineTo(top[0], top[1]); ctx.stroke();
  ctx.restore();
}

function drawBattery(row, col) {
  const scale = scaleNow();
  const bob = REDUCED ? 0 : Math.sin(now / 420) * 3;
  const lift = 12 * scale + bob;
  const size = px(9, 5);

  const centre = project(row + 0.5, col + 0.5, lift);
  ctx.save();
  ctx.shadowColor = P.warning; ctx.shadowBlur = 16;
  /* a small upright cell: body, cap and terminal */
  ctx.fillStyle = shade(P.warning, -0.2);
  ctx.fillRect(centre[0] - size*0.45, centre[1] - size*0.7, size*0.9, size*1.4);
  ctx.fillStyle = P.warning;
  ctx.fillRect(centre[0] - size*0.45, centre[1] - size*0.7, size*0.9, size*0.45);
  ctx.fillStyle = shade(P.warning, 0.4);
  ctx.fillRect(centre[0] - size*0.16, centre[1] - size*0.95, size*0.32, size*0.3);
  ctx.restore();

  /* glow pooled on the floor beneath it */
  const floorPoint = project(row + 0.5, col + 0.5, 0);
  const glow = ctx.createRadialGradient(floorPoint[0], floorPoint[1], 0,
                                        floorPoint[0], floorPoint[1], size*2.4);
  glow.addColorStop(0, rgba(P.warning, 0.4));
  glow.addColorStop(1, rgba(P.warning, 0));
  ctx.save(); ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(floorPoint[0], floorPoint[1], size*2.4, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

function drawConsole(row, col, opened) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const height = Math.max(cam.wall, 16) * scale;
  const pulse = REDUCED ? 0.8 : 0.6 + 0.4 * Math.sin(now / 380);
  const colour = opened ? P.success : shade(P.success, -0.25);

  /* the raised platform */
  fillPath(tileQuad(row, col, 4 * scale), shade(P.success, -0.5),
           rgba(P.success, 0.7), 1.3);

  /* the holographic panel standing on it */
  const a = project(row + 0.85, col + 0.15, 4 * scale);
  const b = project(row + 0.85, col + 0.85, 4 * scale);
  const c = project(row + 0.85, col + 0.85, height * 0.85);
  const d = project(row + 0.85, col + 0.15, height * 0.85);
  ctx.save();
  ctx.globalAlpha = 0.30 + 0.25 * pulse;
  fillPath([a, b, c, d], colour);
  ctx.restore();
  fillPath([a, b, c, d], null, rgba(P.success, 0.85), 1.4);

  /* readout lines on the panel */
  ctx.save();
  ctx.globalAlpha = 0.75; ctx.strokeStyle = rgba("#FFFFFF", 0.5); ctx.lineWidth = 1;
  for (let i = 1; i <= 3; i++) {
    const lift = height * 0.85 * (i / 4.4) + 5 * scale;
    const left = project(row + 0.85, col + 0.28, lift);
    const right = project(row + 0.85, col + (i === 2 ? 0.60 : 0.74), lift);
    ctx.beginPath(); ctx.moveTo(left[0], left[1]); ctx.lineTo(right[0], right[1]); ctx.stroke();
  }
  ctx.restore();

  /* a green pulse spreading over the floor once the panel is reached */
  if (opened) {
    const centre = project(row + 0.5, col + 0.5, 0);
    const glow = ctx.createRadialGradient(centre[0], centre[1], 0,
                                          centre[0], centre[1], 60 * scale);
    glow.addColorStop(0, rgba(P.success, 0.42));
    glow.addColorStop(1, rgba(P.success, 0));
    ctx.save(); ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(centre[0], centre[1], 60 * scale, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* =====================================================================
   Room 2: the bridge sector
   ===================================================================== */

/* An open maintenance shaft. Drawn as a hole with visible depth rather than a
   dark tile, so the drop reads immediately as somewhere the robot must not go. */
function drawPit(row, col, depth) {
  const scale = scaleNow();
  const drop = (depth === undefined ? 34 : depth) * scale;

  const rim = tileQuad(row, col, 0);
  const floorOfShaft = tileQuad(row, col, -drop);

  /* the two inside walls that catch the light */
  fillPath([rim[0], rim[1], floorOfShaft[1], floorOfShaft[0]], shade(P.shaft, 0.14));
  fillPath([rim[0], rim[3], floorOfShaft[3], floorOfShaft[0]], shade(P.shaft, 0.06));
  /* the bottom, effectively black */
  fillPath(floorOfShaft, P.shaft);

  /* Only the cells at the edge of the shaft get a warning rim. Marking every
     cell would draw an amber mesh across the whole hole and, worse, would give
     the deep scenery cells the same emphasis as the ones R-5 can actually walk
     into. `edge` is true only where a walkable tile is next door. */
  const edge = isEdgeOfShaft(row, col);
  fillPath(rim, "rgba(0,0,0,0.45)",
           rgba(P.warning, edge ? 0.42 : 0.10), edge ? 1.3 : 0.8);
}

/* Is this hole one a robot standing next to it could fall into? */
function isEdgeOfShaft(row, col) {
  const neighbours = [[row-1, col], [row+1, col], [row, col-1], [row, col+1]];
  for (const [r, c] of neighbours) {
    const kind = tileAt(r, c);
    if (kind !== "wall" && kind !== "pit") return true;
  }
  return false;
}

/* A sound bridge: a metal deck with a girder along each long edge. */
function drawBridge(row, col, kind) {
  const scale = scaleNow();
  if (!QUALITY[view.quality].decor) return;

  const railHeight = 5 * scale;
  const colour = kind === "collapsing_bridge"
    ? shade(P.collapsing, 0.25) : shade(P.bridgeLight, 0.1);

  ctx.save();
  ctx.strokeStyle = colour;
  ctx.lineWidth = px(1.8, 1.2);
  ctx.globalAlpha = 0.75;
  /* two girders, drawn as raised lines along the tile */
  [[0.08, 0.08, 0.08, 0.92], [0.92, 0.08, 0.92, 0.92]].forEach(edge => {
    const a = project(row + edge[0], col + edge[1], railHeight);
    const b = project(row + edge[2], col + edge[3], railHeight);
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(b[0], b[1]);
    ctx.stroke();
  });
  ctx.restore();

  /* collapsing bridges carry hazard striping so they are never a surprise */
  if (kind === "collapsing_bridge") {
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = P.warning;
    ctx.lineWidth = px(1.4, 1);
    for (let i = 1; i <= 3; i++) {
      const t = i / 4;
      const a = project(row + t, col + 0.1, 1);
      const b = project(row + t, col + 0.9, 1);
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* A bridge in the act of giving way: it shakes, cracks, then drops away. */
function drawCollapsingBridge(row, col, progress) {
  const scale = scaleNow();
  const shakePhase = Math.min(1, progress / 0.45);
  const fallPhase = Math.max(0, (progress - 0.45) / 0.55);

  /* the hole it is about to become, drawn underneath */
  drawPit(row, col);

  if (fallPhase >= 1) return;

  const wobble = REDUCED ? 0 : Math.sin(now / 28) * 2.2 * (1 - shakePhase * 0.4);
  const drop = fallPhase * 30 * scale;
  const tilt = fallPhase * 0.35;

  ctx.save();
  ctx.globalAlpha = 1 - fallPhase * 0.85;
  ctx.translate(wobble, drop);

  const deck = [
    project(row + tilt, col, 0),
    project(row + tilt, col + 1, 0),
    project(row + 1, col + 1, 0),
    project(row + 1, col, 0),
  ];
  fillPath(deck, shade(P.collapsing, 0.05 - fallPhase * 0.3),
           rgba(P.warning, 0.6), 1.2);

  /* cracks spreading across the deck as it goes */
  if (shakePhase > 0.3) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, (shakePhase - 0.3) * 3);
    ctx.strokeStyle = "rgba(0,0,0,0.75)";
    ctx.lineWidth = px(1.5, 1);
    const centre = project(row + 0.5, col + 0.5, 0);
    for (let i = 0; i < 4; i++) {
      const angle = i * Math.PI / 2 + 0.6;
      ctx.beginPath();
      ctx.moveTo(centre[0], centre[1]);
      ctx.lineTo(centre[0] + Math.cos(angle) * 16 * scale,
                 centre[1] + Math.sin(angle) * 9 * scale);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

/* The security keycard, hovering above its platform. */
function drawKeycard(row, col) {
  const scale = scaleNow();
  const bob = REDUCED ? 0 : Math.sin(now / 380) * 3;
  const lift = 13 * scale + bob;
  const size = px(11, 6);
  const centre = project(row + 0.5, col + 0.5, lift);
  const spin = REDUCED ? 0 : Math.sin(now / 520);

  ctx.save();
  ctx.shadowColor = P.warning;
  ctx.shadowBlur = 16;
  /* the card itself, turning slowly so it catches the light */
  ctx.translate(centre[0], centre[1]);
  ctx.scale(0.35 + 0.65 * Math.abs(spin), 1);
  ctx.fillStyle = P.warning;
  ctx.fillRect(-size * 0.6, -size * 0.4, size * 1.2, size * 0.8);
  ctx.fillStyle = shade(P.warning, -0.45);
  ctx.fillRect(-size * 0.6, -size * 0.4, size * 1.2, size * 0.22);
  ctx.fillStyle = shade(P.warning, 0.55);
  ctx.fillRect(size * 0.1, -size * 0.1, size * 0.36, size * 0.34);
  ctx.restore();

  /* glow pooled on the floor beneath it */
  const floorPoint = project(row + 0.5, col + 0.5, 0);
  const glow = ctx.createRadialGradient(floorPoint[0], floorPoint[1], 0,
                                        floorPoint[0], floorPoint[1], size * 2.6);
  glow.addColorStop(0, rgba(P.warning, 0.38));
  glow.addColorStop(1, rgba(P.warning, 0));
  ctx.save();
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(floorPoint[0], floorPoint[1], size * 2.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* The exit door: red and shut until the keycard is held, then green and open. */
function drawExitDoor(row, col, unlocked, opened) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const height = Math.max(cam.wall, 16) * scale;
  const colour = unlocked ? P.success : P.danger;
  const pulse = REDUCED ? 0.8 : 0.6 + 0.4 * Math.sin(now / 380);

  /* the raised threshold */
  fillPath(tileQuad(row, col, 3 * scale), shade(colour, -0.55),
           rgba(colour, 0.7), 1.3);

  /* the door panel, standing at the back of the tile */
  const a = project(row + 0.88, col + 0.12, 3 * scale);
  const b = project(row + 0.88, col + 0.88, 3 * scale);
  const c = project(row + 0.88, col + 0.88, height * 0.95);
  const d = project(row + 0.88, col + 0.12, height * 0.95);

  if (opened) {
    /* open: only the frame, with light pouring through */
    const light = ctx.createLinearGradient(a[0], a[1], c[0], c[1]);
    light.addColorStop(0, rgba(P.success, 0.55));
    light.addColorStop(1, rgba(P.success, 0.05));
    ctx.save();
    ctx.fillStyle = light;
    fillPath([a, b, c, d], null);
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    [b, c, d].forEach(point => ctx.lineTo(point[0], point[1]));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  } else {
    ctx.save();
    ctx.globalAlpha = 0.42 + 0.2 * pulse;
    fillPath([a, b, c, d], colour);
    ctx.restore();
  }
  fillPath([a, b, c, d], null, rgba(colour, 0.9), 1.5);

  /* the status lamp above the door */
  const lamp = project(row + 0.88, col + 0.5, height * 1.02);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.fillStyle = colour;
  ctx.shadowColor = colour;
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(lamp[0], lamp[1], px(2.6, 2), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  if (opened) {
    const centre = project(row + 0.5, col + 0.5, 0);
    const glow = ctx.createRadialGradient(centre[0], centre[1], 0,
                                          centre[0], centre[1], 60 * scale);
    glow.addColorStop(0, rgba(P.success, 0.4));
    glow.addColorStop(1, rgba(P.success, 0));
    ctx.save();
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(centre[0], centre[1], 60 * scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

/* =====================================================================
   Room 3: the reactor control chamber
   ===================================================================== */

/* A generator, in one of three states.
     "off"      dark grey, nothing running
     "next"     amber pulse — this is the one the sequence wants now
     "running"  lit cyan-green, cables carrying power  */
function drawGenerator(row, col, letter, state) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const height = Math.max(cam.wall, 20) * scale;

  const colour = state === "running" ? P.success
               : (state === "next" ? P.warning : shade(P.metal, 0.1));
  const pulse = (REDUCED || state === "off") ? 0.75
              : 0.55 + 0.45 * Math.sin(now / (state === "next" ? 260 : 420));

  /* the housing: a squat box standing on the floor */
  const top = tileQuad(row, col, height * 0.62, 0.16);
  const base = tileQuad(row, col, 0, 0.16);
  fillPath([top[3], top[2], base[2], base[3]], shade(P.metal, -0.34));
  fillPath([top[2], top[1], base[1], base[2]], shade(P.metal, -0.12));
  fillPath(top, shade(P.metal, 0.18), rgba(P.metalLight, 0.55), 1);

  /* the core window, which is what actually lights up */
  ctx.save();
  ctx.globalAlpha = state === "off" ? 0.4 : pulse;
  ctx.fillStyle = colour;
  if (state !== "off") { ctx.shadowColor = colour; ctx.shadowBlur = 16; }
  const centre = project(row + 0.5, col + 0.5, height * 0.62);
  ctx.beginPath();
  ctx.arc(centre[0], centre[1], px(6, 3), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  /* the letter, so the sequence is readable without relying on colour */
  if (scale > 0.5) {
    ctx.save();
    ctx.font = "700 " + Math.round(px(11, 8)) + "px " +
      '"JetBrains Mono", Consolas, monospace';
    ctx.textAlign = "center";
    ctx.fillStyle = state === "off" ? P.textDim : P.text;
    ctx.fillText(letter, centre[0], centre[1] - px(11, 8));
    ctx.restore();
  }

  /* an energy conduit running down to the floor once it is online */
  if (state === "running") {
    const foot = project(row + 0.5, col + 0.5, 0);
    ctx.save();
    ctx.globalAlpha = 0.5 * pulse;
    ctx.strokeStyle = P.success;
    ctx.lineWidth = px(3, 2);
    ctx.shadowColor = P.success; ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(centre[0], centre[1]);
    ctx.lineTo(foot[0], foot[1]);
    ctx.stroke();
    ctx.restore();
  }
}

/* An electrical hazard: an arc crackling between two floor contacts. */
function drawHazard(row, col) {
  const scale = scaleNow();
  const flicker = REDUCED ? 0.7 : 0.45 + 0.55 * Math.abs(Math.sin(now / 110));

  ctx.save();
  ctx.globalAlpha = 0.34 * flicker;
  fillPath(tileQuad(row, col, 0.5, 0.06), P.danger);
  ctx.restore();

  if (!QUALITY[view.quality].decor) return;

  /* a jagged arc across the tile */
  ctx.save();
  ctx.globalAlpha = flicker;
  ctx.strokeStyle = "#9FD8FF";
  ctx.lineWidth = px(1.8, 1.2);
  ctx.shadowColor = P.cyan; ctx.shadowBlur = 12;
  ctx.beginPath();
  const steps = 5;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const wobble = (i === 0 || i === steps) ? 0
                 : (cellNoise(row, col, i + Math.floor(now / 90)) - 0.5) * 0.34;
    const point = project(row + 0.2 + t * 0.6 + wobble, col + 0.5,
                          (5 + Math.abs(wobble) * 40) * scale);
    if (i === 0) ctx.moveTo(point[0], point[1]); else ctx.lineTo(point[0], point[1]);
  }
  ctx.stroke();
  ctx.restore();
}

/* A sliding door: two halves that part when it is open. */
function drawSlidingDoor(row, col, open) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const height = Math.max(cam.wall, 16) * scale;
  const gap = open ? 0.36 : 0.02;
  const colour = open ? P.success : P.warning;

  fillPath(tileQuad(row, col, 1), shade(P.metalLight, -0.35),
           rgba(colour, 0.55), 1.1);

  [-1, 1].forEach(side => {
    const near = 0.5 + side * gap;
    const far = 0.5 + side * 0.5;
    const a = project(row + Math.min(near, far), col + 0.12, 2 * scale);
    const b = project(row + Math.max(near, far), col + 0.12, 2 * scale);
    const c = project(row + Math.max(near, far), col + 0.12, height * 0.8);
    const d = project(row + Math.min(near, far), col + 0.12, height * 0.8);
    fillPath([a, b, c, d], shade(P.metalLight, -0.1), rgba(colour, 0.7), 1.1);
  });

  /* a status lamp, so open and shut are readable without relying on colour */
  const lamp = project(row + 0.5, col + 0.88, height * 0.9);
  ctx.save();
  ctx.fillStyle = colour;
  ctx.shadowColor = colour; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(lamp[0], lamp[1], px(2.4, 1.8), 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

/* The reactor blast door: heavy, shut and red until all three generators run. */
function drawReactorDoor(row, col, unlocked) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const height = Math.max(cam.wall, 22) * scale;
  const colour = unlocked ? P.success : P.danger;
  const pulse = REDUCED ? 0.8 : 0.6 + 0.4 * Math.sin(now / 400);

  fillPath(tileQuad(row, col, 2 * scale), shade(colour, -0.6),
           rgba(colour, 0.7), 1.3);

  if (unlocked) {
    /* open: the frame with light coming through from the far side */
    const a = project(row + 0.5, col + 0.06, 2 * scale);
    const b = project(row + 0.5, col + 0.94, 2 * scale);
    const c = project(row + 0.5, col + 0.94, height);
    const d = project(row + 0.5, col + 0.06, height);
    const light = ctx.createLinearGradient(a[0], a[1], c[0], c[1]);
    light.addColorStop(0, rgba(P.success, 0.6));
    light.addColorStop(1, rgba(P.success, 0.05));
    ctx.save(); ctx.fillStyle = light;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]);
    [b, c, d].forEach(point => ctx.lineTo(point[0], point[1]));
    ctx.closePath(); ctx.fill(); ctx.restore();
    fillPath([a, b, c, d], null, rgba(P.success, 0.9), 1.6);
  } else {
    /* shut: two heavy leaves meeting in the middle */
    [-1, 1].forEach(side => {
      const near = 0.5;
      const far = 0.5 + side * 0.46;
      const a = project(row + 0.5, col + Math.min(near, far), 2 * scale);
      const b = project(row + 0.5, col + Math.max(near, far), 2 * scale);
      const c = project(row + 0.5, col + Math.max(near, far), height);
      const d = project(row + 0.5, col + Math.min(near, far), height);
      fillPath([a, b, c, d], shade(P.collapsing, -0.25), rgba(colour, 0.75), 1.3);
    });
    ctx.save();
    ctx.globalAlpha = pulse;
    const lamp = project(row + 0.5, col + 0.5, height * 1.04);
    ctx.fillStyle = colour; ctx.shadowColor = colour; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.arc(lamp[0], lamp[1], px(3, 2), 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

/* The security robot. Deliberately built from the same parts as R-5 so it reads as
   laboratory equipment, but squarer and with a red sensor instead of a cyan core. */
function drawGuard(row, col, alpha) {
  const scale = scaleNow();
  const unit = px(CAMERAS[view.camera].tileW * 0.24, 7);
  const floorPoint = project(row + 0.5, col + 0.5, 0);
  const bodyPoint = project(row + 0.5, col + 0.5, 9 * scale);
  const sweep = REDUCED ? 0 : now / 420;

  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;

  if (QUALITY[view.quality].shadows) {
    ctx.save();
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.ellipse(floorPoint[0], floorPoint[1], unit * 0.95, unit * 0.48, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  /* a red pool of light, which is the warning that it is close */
  const pool = ctx.createRadialGradient(floorPoint[0], floorPoint[1], 0,
                                        floorPoint[0], floorPoint[1], unit * 2.2);
  pool.addColorStop(0, rgba(P.danger, 0.30));
  pool.addColorStop(1, rgba(P.danger, 0));
  ctx.fillStyle = pool;
  ctx.beginPath();
  ctx.arc(floorPoint[0], floorPoint[1], unit * 2.2, 0, Math.PI * 2);
  ctx.fill();

  /* a boxy chassis */
  ctx.fillStyle = shade(P.metal, 0.05);
  ctx.strokeStyle = rgba(P.danger, 0.5);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.rect(bodyPoint[0] - unit * 0.62, bodyPoint[1] - unit * 0.72,
           unit * 1.24, unit * 1.34);
  ctx.fill();
  ctx.stroke();

  /* the scanning sensor */
  ctx.save();
  ctx.fillStyle = P.danger;
  ctx.shadowColor = P.danger; ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.arc(bodyPoint[0], bodyPoint[1] - unit * 0.1, unit * 0.28, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  /* a slow sweep beam, so which way it is looking is obvious */
  if (QUALITY[view.quality].decor) {
    const reach = unit * 2.0;
    ctx.save();
    ctx.globalAlpha = 0.32;
    ctx.strokeStyle = P.danger;
    ctx.lineWidth = px(2.2, 1.4);
    ctx.beginPath();
    ctx.moveTo(bodyPoint[0], bodyPoint[1]);
    ctx.lineTo(bodyPoint[0] + Math.cos(sweep) * reach,
               bodyPoint[1] + Math.sin(sweep) * reach * 0.55);
    ctx.stroke();
    ctx.restore();
  }

  if (scale > 0.55) {
    ctx.font = "600 " + Math.round(unit * 0.55) + "px " +
      '"JetBrains Mono", Consolas, monospace';
    ctx.textAlign = "center";
    ctx.fillStyle = rgba(P.danger, 0.9);
    ctx.fillText(SCENE.meta.guardLabel || "SEC", bodyPoint[0],
                 bodyPoint[1] - unit * 1.05);
  }
  ctx.restore();
}

/* =====================================================================
   Room 4: the continuous wind tunnel

   The hall is 10 x 10 metres and one metre is drawn as one cell, so all of the
   projection, camera and rotation code above applies unchanged. World coordinates
   only need converting first: col = x, row = height - y.
   ===================================================================== */

const CONT = SCENE.continuous || null;

function worldToCell(x, y) {
  return [CONT.height - y, x];
}

/* World metres straight to screen pixels, through the shared projection. */
function projectWorld(x, y, lift) {
  const [row, col] = worldToCell(x, y);
  const [rr, cc] = rotatePoint(row, col);
  return project(rr, cc, lift || 0);
}

/* An ellipse on the floor plane, which is what a circle looks like in isometric.
   Drawn as a polygon so it follows the camera and the rotation properly. */
function floorEllipse(x, y, radius, lift, steps) {
  const count = steps || 22;
  const points = [];
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    points.push(projectWorld(x + Math.cos(angle) * radius,
                             y + Math.sin(angle) * radius, lift || 0));
  }
  return points;
}

/* The landing pad: a glowing ring that pulses green, or floods on touchdown. */
function drawLandingPad(landed) {
  const scale = scaleNow();
  const pad = CONT.goal;
  const radius = CONT.goalRadius;
  const pulse = REDUCED ? 0.8 : 0.55 + 0.45 * Math.sin(now / 420);

  ctx.save();
  ctx.globalAlpha = (landed ? 0.55 : 0.24) * (landed ? 1 : pulse);
  fillPath(floorEllipse(pad[0], pad[1], radius, 0.6), P.success);
  ctx.restore();
  fillPath(floorEllipse(pad[0], pad[1], radius, 0.6), null,
           rgba(P.success, landed ? 0.95 : 0.7), landed ? 2.2 : 1.5);

  /* approach markers, so the pad reads as equipment rather than a coloured blob */
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const inner = projectWorld(pad[0] + Math.cos(angle) * radius * 1.25,
                               pad[1] + Math.sin(angle) * radius * 1.25, 0.6);
    ctx.save();
    ctx.globalAlpha = 0.7 * pulse;
    ctx.fillStyle = P.success;
    ctx.beginPath();
    ctx.arc(inner[0], inner[1], px(1.8, 1.2), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  if (landed) {
    const centre = projectWorld(pad[0], pad[1], 0);
    const glow = ctx.createRadialGradient(centre[0], centre[1], 0,
                                          centre[0], centre[1], 70 * scale);
    glow.addColorStop(0, rgba(P.success, 0.45));
    glow.addColorStop(1, rgba(P.success, 0));
    ctx.save(); ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(centre[0], centre[1], 70 * scale, 0, Math.PI * 2);
    ctx.fill(); ctx.restore();
  }
}

function drawStartMarker() {
  const start = CONT.start;
  ctx.save();
  ctx.globalAlpha = 0.4;
  fillPath(floorEllipse(start[0], start[1], 0.45, 0.4), P.cyanDim);
  ctx.restore();
  fillPath(floorEllipse(start[0], start[1], 0.45, 0.4), null,
           rgba(P.cyan, 0.7), 1.2);
}

/* An obstacle, raised off the deck so it reads as something to fly around. */
function drawObstacle(obstacle) {
  const scale = scaleNow();
  const height = 26 * scale;

  if (obstacle.kind === "circle") {
    const top = floorEllipse(obstacle.x, obstacle.y, obstacle.radius, height);
    const base = floorEllipse(obstacle.x, obstacle.y, obstacle.radius, 0);
    /* the side wall, as a band between the two rings */
    for (let i = 0; i < top.length; i++) {
      const next = (i + 1) % top.length;
      const shadeAmount = -0.34 + 0.22 * (i / top.length);
      fillPath([base[i], base[next], top[next], top[i]],
               shade(P.metal, shadeAmount));
    }
    fillPath(top, shade(P.metal, 0.2), rgba(P.metalLight, 0.6), 1.1);
    return;
  }

  /* a rectangular block */
  const corners = [[obstacle.x0, obstacle.y0], [obstacle.x1, obstacle.y0],
                   [obstacle.x1, obstacle.y1], [obstacle.x0, obstacle.y1]];
  const top = corners.map(([x, y]) => projectWorld(x, y, height));
  const base = corners.map(([x, y]) => projectWorld(x, y, 0));
  for (let i = 0; i < 4; i++) {
    const next = (i + 1) % 4;
    fillPath([base[i], base[next], top[next], top[i]],
             shade(P.metal, -0.3 + 0.16 * (i / 4)));
  }
  fillPath(top, shade(P.metal, 0.2), rgba(P.metalLight, 0.6), 1.1);

  /* amber hazard striping on the top face */
  if (QUALITY[view.quality].decor) {
    ctx.save();
    ctx.globalAlpha = 0.45;
    ctx.strokeStyle = P.warning;
    ctx.lineWidth = px(1.4, 1);
    for (let i = 1; i <= 3; i++) {
      const t = i / 4;
      const a = projectWorld(obstacle.x0 + (obstacle.x1 - obstacle.x0) * t,
                             obstacle.y0, height);
      const b = projectWorld(obstacle.x0 + (obstacle.x1 - obstacle.x0) * t,
                             obstacle.y1, height);
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    ctx.restore();
  }
}

/* A ventilation fan: a housing with blades that turn. */
function drawFan(fan) {
  const scale = scaleNow();
  const lift = 18 * scale;
  const centre = projectWorld(fan.x, fan.y, lift);
  const radius = px(fan.radius * 3.2, 8);
  const spin = REDUCED ? 0 : now / (260 / Math.max(0.4, fan.strength));

  /* housing */
  ctx.save();
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = shade(P.metal, -0.1);
  ctx.strokeStyle = rgba(P.metalLight, 0.6);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.ellipse(centre[0], centre[1], radius, radius * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  /* four blades */
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.strokeStyle = shade(P.cyan, -0.15);
  ctx.lineWidth = px(2.2, 1.4);
  for (let i = 0; i < 4; i++) {
    const angle = spin + i * Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(centre[0], centre[1]);
    ctx.lineTo(centre[0] + Math.cos(angle) * radius * 0.85,
               centre[1] + Math.sin(angle) * radius * 0.85 * 0.55);
    ctx.stroke();
  }
  ctx.restore();

  /* the direction it blows */
  const tip = projectWorld(fan.x + fan.dx * 0.9, fan.y + fan.dy * 0.9, lift);
  ctx.save();
  ctx.globalAlpha = 0.65;
  ctx.strokeStyle = P.cyan;
  ctx.lineWidth = px(2, 1.4);
  ctx.beginPath(); ctx.moveTo(centre[0], centre[1]); ctx.lineTo(tip[0], tip[1]);
  ctx.stroke();
  ctx.restore();
}

/* The airflow field, as arrows whose length follows the local force. */
function drawWindField() {
  if (!view.showWind) return;
  const scale = scaleNow();
  const drift = REDUCED ? 0 : (now / 900) % 1;

  CONT.windField.forEach((sample, index) => {
    const magnitude = Math.hypot(sample.dx, sample.dy);
    if (magnitude < 0.02) return;
    const length = Math.min(0.85, 0.22 + magnitude * 0.30);
    /* animate by sliding the arrow along its own direction */
    const phase = ((drift + (index % 5) / 5) % 1) * 0.25;
    const fromX = sample.x + (sample.dx / magnitude) * (phase - 0.12) * 0.6;
    const fromY = sample.y + (sample.dy / magnitude) * (phase - 0.12) * 0.6;
    const toX = fromX + (sample.dx / magnitude) * length;
    const toY = fromY + (sample.dy / magnitude) * length;

    const a = projectWorld(fromX, fromY, 4 * scale);
    const b = projectWorld(toX, toY, 4 * scale);

    ctx.save();
    ctx.globalAlpha = Math.min(0.5, 0.14 + magnitude * 0.13);
    ctx.strokeStyle = P.cyan;
    ctx.lineWidth = px(1.1 + magnitude * 0.5, 0.9);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    /* a small head, so direction is readable and not just a line */
    const angle = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const head = px(3.2, 2);
    ctx.beginPath();
    ctx.moveTo(b[0], b[1]);
    ctx.lineTo(b[0] - head * Math.cos(angle - 0.5), b[1] - head * Math.sin(angle - 0.5));
    ctx.moveTo(b[0], b[1]);
    ctx.lineTo(b[0] - head * Math.cos(angle + 0.5), b[1] - head * Math.sin(angle + 0.5));
    ctx.stroke();
    ctx.restore();
  });
}

/* The flight path so far, fading out behind the drone. */
function drawTrail() {
  if (!view.showTrail) return;
  const scale = scaleNow();
  const upto = clamp(view.index, 0, FRAMES.length - 1);
  const first = Math.max(0, upto - 60);

  ctx.save();
  ctx.lineWidth = px(2, 1.4);
  for (let i = first + 1; i <= upto; i++) {
    const a = projectWorld(FRAMES[i - 1].x, FRAMES[i - 1].y, 8 * scale);
    const b = projectWorld(FRAMES[i].x, FRAMES[i].y, 8 * scale);
    const age = (i - first) / Math.max(1, upto - first);
    ctx.globalAlpha = 0.10 + 0.45 * age;
    ctx.strokeStyle = FRAMES[i].collision || FRAMES[i].boundary
      ? P.danger : P.cyan;
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  }
  ctx.restore();
}

/* The R-5 drone. Same cyan identity core as the ground robot, on a four-rotor
   frame, tilting into whatever is pushing it. */
function drawDrone(frame, x, y) {
  const scale = scaleNow();
  const unit = px(CAMERAS[view.camera].tileW * 0.20, 6);
  const floorPoint = projectWorld(x, y, 0);
  const lift = 11 * scale;
  const body = projectWorld(x, y, lift);

  /* tilt into the combined thrust and wind, which is the visible sign of force */
  const forceX = (frame.thrust_x || 0) + (frame.wind_x || 0);
  const forceY = (frame.thrust_y || 0) + (frame.wind_y || 0);
  const tiltX = clamp(forceX * 0.16, -0.5, 0.5);
  const tiltY = clamp(forceY * 0.16, -0.5, 0.5);

  ctx.save();

  if (QUALITY[view.quality].shadows) {
    ctx.save();
    ctx.globalAlpha = 0.34;
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.ellipse(floorPoint[0], floorPoint[1], unit * 1.0, unit * 0.5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  /* cyan pool of light on the deck below */
  const pool = ctx.createRadialGradient(floorPoint[0], floorPoint[1], 0,
                                        floorPoint[0], floorPoint[1], unit * 2.4);
  pool.addColorStop(0, rgba(P.cyan, 0.30));
  pool.addColorStop(1, rgba(P.cyan, 0));
  ctx.fillStyle = pool;
  ctx.beginPath();
  ctx.arc(floorPoint[0], floorPoint[1], unit * 2.4, 0, Math.PI * 2);
  ctx.fill();

  /* the four rotors, on arms that tilt with the force */
  const rotorSpin = REDUCED ? 0 : now / 40;
  [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sy], index) => {
    const arm = projectWorld(x + sx * 0.30 + tiltX * 0.2,
                             y + sy * 0.30 + tiltY * 0.2, lift);
    ctx.save();
    ctx.strokeStyle = shade(P.metalLight, -0.05);
    ctx.lineWidth = px(1.6, 1.1);
    ctx.beginPath();
    ctx.moveTo(body[0], body[1]);
    ctx.lineTo(arm[0], arm[1]);
    ctx.stroke();
    /* the blur of a spinning rotor */
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = rgba(P.cyan, 0.8);
    ctx.lineWidth = px(1.2, 1);
    const wobble = Math.sin(rotorSpin + index) * 0.4 + 1.0;
    ctx.beginPath();
    ctx.ellipse(arm[0], arm[1], unit * 0.42 * wobble, unit * 0.20, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  });

  /* the body, tilted */
  ctx.save();
  ctx.translate(body[0], body[1]);
  ctx.rotate(tiltX * 0.5);
  const gradient = ctx.createLinearGradient(0, -unit, 0, unit * 0.7);
  gradient.addColorStop(0, shade(P.metalLight, 0.32));
  gradient.addColorStop(1, shade(P.metal, -0.2));
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.ellipse(0, 0, unit * 0.62, unit * 0.42, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = rgba("#FFFFFF", 0.4);
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();

  /* the identity core */
  const pulse = REDUCED ? 1 : 0.86 + 0.14 * Math.sin(now / 300);
  ctx.save();
  ctx.shadowColor = P.cyan; ctx.shadowBlur = 16 * pulse;
  ctx.fillStyle = P.cyan;
  ctx.beginPath();
  ctx.arc(body[0], body[1], unit * 0.26 * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#EAFBFF";
  ctx.beginPath();
  ctx.arc(body[0], body[1], unit * 0.12 * pulse, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  /* velocity and thrust vectors, on request */
  if (view.showVectors) {
    drawVector(x, y, frame.vx, frame.vy, P.cyan, lift, 0.55);
    drawVector(x, y, frame.thrust_x, frame.thrust_y, P.warning, lift, 0.7);
    drawVector(x, y, frame.wind_x, frame.wind_y, P.purple, lift, 0.7);
  }

  if (scale > 0.55) {
    ctx.font = "600 " + Math.round(unit * 0.6) + "px " +
      '"JetBrains Mono", Consolas, monospace';
    ctx.textAlign = "center";
    ctx.fillStyle = rgba(P.text, 0.85);
    ctx.fillText("R-5", body[0], body[1] - unit * 1.5);
  }
  ctx.restore();
}

function drawVector(x, y, dx, dy, colour, lift, scaleFactor) {
  const magnitude = Math.hypot(dx || 0, dy || 0);
  if (magnitude < 0.03) return;
  const a = projectWorld(x, y, lift);
  const b = projectWorld(x + (dx || 0) * scaleFactor,
                         y + (dy || 0) * scaleFactor, lift);
  ctx.save();
  ctx.globalAlpha = 0.85;
  ctx.strokeStyle = colour;
  ctx.lineWidth = px(2, 1.4);
  ctx.shadowColor = colour; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  const angle = Math.atan2(b[1] - a[1], b[0] - a[0]);
  const head = px(5, 3);
  ctx.beginPath();
  ctx.moveTo(b[0], b[1]);
  ctx.lineTo(b[0] - head * Math.cos(angle - 0.45), b[1] - head * Math.sin(angle - 0.45));
  ctx.lineTo(b[0] - head * Math.cos(angle + 0.45), b[1] - head * Math.sin(angle + 0.45));
  ctx.closePath();
  ctx.fillStyle = colour;
  ctx.fill();
  ctx.restore();
}

/* Everything continuous, in back-to-front order. */
function drawContinuousLayer(frame, droneX, droneY) {
  drawWindField();
  drawStartMarker();
  drawLandingPad(!!frame.safe_landing);

  /* obstacles and the drone, sorted by depth so nearer things cover farther ones */
  const items = CONT.obstacles.map(obstacle => {
    const centreX = obstacle.kind === "circle" ? obstacle.x
                                              : (obstacle.x0 + obstacle.x1) / 2;
    const centreY = obstacle.kind === "circle" ? obstacle.y
                                              : (obstacle.y0 + obstacle.y1) / 2;
    const [row, col] = rotatePoint(...worldToCell(centreX, centreY));
    return { depth: row + col, draw: () => drawObstacle(obstacle) };
  });

  const [droneRow, droneCol] = rotatePoint(...worldToCell(droneX, droneY));
  items.push({ depth: droneRow + droneCol + 0.3,
               draw: () => drawDrone(frame, droneX, droneY) });

  CONT.fans.forEach(fan => {
    const [row, col] = rotatePoint(...worldToCell(fan.x, fan.y));
    items.push({ depth: row + col - 0.2, draw: () => drawFan(fan) });
  });

  items.sort((a, b) => a.depth - b.depth);
  items.forEach(item => item.draw());
}

/* =====================================================================
   Room 5: the adaptive storage facility
   ===================================================================== */

/* A tall storage shelf — the same block as a wall, but racked. */
function drawShelf(row, col) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const height = Math.max(cam.wall, 20) * scale;
  const top = tileQuad(row, col, height);
  const base = tileQuad(row, col, 0);

  fillPath([top[3], top[2], base[2], base[3]], shade(P.metal, -0.36));
  fillPath([top[2], top[1], base[1], base[2]], shade(P.metal, -0.14));
  fillPath(top, shade(P.metal, 0.18), rgba(P.metalLight, 0.5), 1);

  if (!QUALITY[view.quality].decor) return;
  /* two shelf rails, so it reads as racking rather than a plain wall */
  ctx.save();
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = shade(P.metalLight, 0.05);
  ctx.lineWidth = px(1.3, 1);
  [0.35, 0.7].forEach(fraction => {
    const a = project(row + 1, col, height * fraction);
    const b = project(row + 1, col + 1, height * fraction);
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
  });
  ctx.restore();
}

/* A stacked crate, lower than the racking. */
function drawCrate(row, col) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const height = Math.max(cam.wall, 20) * scale * 0.55;
  const top = tileQuad(row, col, height, 0.10);
  const base = tileQuad(row, col, 0, 0.10);
  fillPath([top[3], top[2], base[2], base[3]], shade("#6A5433", -0.36));
  fillPath([top[2], top[1], base[1], base[2]], shade("#6A5433", -0.12));
  fillPath(top, shade("#6A5433", 0.16), rgba(P.warning, 0.35), 1);
}

/* A conveyor belt, with the direction of travel scrolling along it. */
function drawConveyor(row, col, delta) {
  const scale = scaleNow();
  if (!delta) return;
  const drift = REDUCED ? 0 : (now / 700) % 1;
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.strokeStyle = P.warning;
  ctx.lineWidth = px(1.6, 1.1);
  for (let i = 0; i < 3; i++) {
    const phase = ((drift + i / 3) % 1) * 0.8 + 0.1;
    const from = project(row + 0.5 - delta[0] * (0.4 - phase * 0.35),
                         col + 0.5 - delta[1] * (0.4 - phase * 0.35), 2 * scale);
    const to = project(row + 0.5 - delta[0] * (0.15 - phase * 0.35),
                       col + 0.5 - delta[1] * (0.15 - phase * 0.35), 2 * scale);
    ctx.beginPath(); ctx.moveTo(from[0], from[1]); ctx.lineTo(to[0], to[1]);
    ctx.stroke();
  }
  ctx.restore();
}

/* The access terminal: a console that turns from amber to green when used. */
function drawTerminal(row, col, activated) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const height = Math.max(cam.wall, 18) * scale;
  const colour = activated ? P.success : P.warning;
  const pulse = REDUCED ? 0.8 : 0.55 + 0.45 * Math.sin(now / 340);

  fillPath(tileQuad(row, col, 3 * scale, 0.14), shade(colour, -0.55),
           rgba(colour, 0.75), 1.3);

  const a = project(row + 0.82, col + 0.18, 3 * scale);
  const b = project(row + 0.82, col + 0.82, 3 * scale);
  const c = project(row + 0.82, col + 0.82, height * 0.8);
  const d = project(row + 0.82, col + 0.18, height * 0.8);
  ctx.save();
  ctx.globalAlpha = 0.35 + 0.3 * pulse;
  fillPath([a, b, c, d], colour);
  ctx.restore();
  fillPath([a, b, c, d], null, rgba(colour, 0.9), 1.4);

  const lamp = project(row + 0.82, col + 0.5, height * 0.92);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.fillStyle = colour; ctx.shadowColor = colour; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(lamp[0], lamp[1], px(2.6, 2), 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

/* A charging station: a pad with a cyan glow. */
function drawCharger(row, col) {
  const scale = scaleNow();
  const pulse = REDUCED ? 0.7 : 0.45 + 0.45 * Math.sin(now / 500);
  ctx.save();
  ctx.globalAlpha = 0.4 * pulse;
  fillPath(tileQuad(row, col, 1, 0.16), P.cyan);
  ctx.restore();
  fillPath(tileQuad(row, col, 1, 0.16), null, rgba(P.cyan, 0.6), 1.1);
}

/* The radar sweep, drawn from the reading the agent actually received. */
function drawRadar(frame, row, col) {
  if (!view.showWind) return;          /* shares the Wind toggle */
  const scale = scaleNow();
  const rays = frame.radar_observation || [];
  const range = SCENE.meta.radarRange || 4;
  const directions = SCENE.radarDirections || [];
  const sweep = REDUCED ? 0 : (now / 900) % 1;

  rays.forEach((value, index) => {
    const direction = directions[index];
    if (!direction) return;
    const reach = value * range;
    const from = project(row + 0.5, col + 0.5, 5 * scale);
    const to = project(row + 0.5 + direction[0] * reach,
                       col + 0.5 + direction[1] * reach, 5 * scale);
    /* close contacts go amber, then red, so danger is not colour alone —
       the ray also gets visibly shorter */
    const closeness = 1 - value;
    const colour = closeness > 0.7 ? P.danger
                 : (closeness > 0.45 ? P.warning : P.cyan);
    ctx.save();
    ctx.globalAlpha = 0.16 + 0.3 * Math.abs(Math.sin((sweep + index / 8) * Math.PI));
    ctx.strokeStyle = colour;
    ctx.lineWidth = px(1.4, 1);
    ctx.beginPath(); ctx.moveTo(from[0], from[1]); ctx.lineTo(to[0], to[1]);
    ctx.stroke();
    ctx.restore();
  });

  /* a danger ring when a maintenance robot is close */
  const nearest = frame.nearest_robot === undefined ? 1 : frame.nearest_robot;
  if (nearest < 0.35) {
    const centre = project(row + 0.5, col + 0.5, 2 * scale);
    ctx.save();
    ctx.globalAlpha = 0.5 * (REDUCED ? 1 : 0.5 + 0.5 * Math.sin(now / 160));
    ctx.strokeStyle = P.danger;
    ctx.lineWidth = px(2, 1.4);
    ctx.beginPath();
    ctx.ellipse(centre[0], centre[1], 26 * scale, 14 * scale, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

/* Which visual state a generator is in, given the mission stage. */
function generatorState(letter, stage) {
  const order = { a: 1, b: 2, c: 3 };
  const needed = order[letter];
  if (stage >= needed) return "running";
  if (stage === needed - 1) return "next";
  return "off";
}

function drawStartPlatform(row, col) {
  const scale = scaleNow();
  fillPath(tileQuad(row, col, 2 * scale), shade(P.cyanDim, -0.15),
           rgba(P.cyan, 0.6), 1.2);
  const centre = project(row + 0.5, col + 0.5, 3 * scale);
  ctx.save();
  ctx.globalAlpha = 0.55;
  ctx.strokeStyle = rgba(P.cyan, 0.8); ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(centre[0], centre[1], 15*scale, 8*scale, 0, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function drawDoor(row, col, direction) {
  const cam = CAMERAS[view.camera];
  const scale = scaleNow();
  const height = Math.max(cam.wall, 14) * scale;
  const delta = DELTAS[String(direction)] || [0, 1];

  fillPath(tileQuad(row, col, 1), shade(P.metalLight, -0.2),
           rgba(P.warning, 0.55), 1.2);

  /* two door posts */
  [[-0.42, 0], [0.42, 0]].forEach(([offsetRow, offsetCol]) => {
    const foot = project(row + 0.5 + offsetRow, col + 0.5 + offsetCol, 0);
    const head = project(row + 0.5 + offsetRow, col + 0.5 + offsetCol, height * 0.8);
    ctx.save();
    ctx.strokeStyle = shade(P.metalLight, 0.05);
    ctx.lineWidth = px(4, 2);
    ctx.beginPath(); ctx.moveTo(foot[0], foot[1]); ctx.lineTo(head[0], head[1]); ctx.stroke();
    ctx.restore();
  });

  /* a mechanical arrow showing the only direction it may be crossed */
  const from = project(row + 0.5 - delta[0]*0.3, col + 0.5 - delta[1]*0.3, 6*scale);
  const to = project(row + 0.5 + delta[0]*0.3, col + 0.5 + delta[1]*0.3, 6*scale);
  const glow = REDUCED ? 0.85 : 0.6 + 0.4 * Math.sin(now / 300);
  ctx.save();
  ctx.globalAlpha = glow;
  ctx.strokeStyle = P.warning; ctx.lineWidth = px(2.6, 1.8);
  ctx.shadowColor = P.warning; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(from[0], from[1]); ctx.lineTo(to[0], to[1]); ctx.stroke();
  const angle = Math.atan2(to[1]-from[1], to[0]-from[0]);
  const head = px(7, 4);
  ctx.beginPath();
  ctx.moveTo(to[0], to[1]);
  ctx.lineTo(to[0] - head*Math.cos(angle-0.5), to[1] - head*Math.sin(angle-0.5));
  ctx.lineTo(to[0] - head*Math.cos(angle+0.5), to[1] - head*Math.sin(angle+0.5));
  ctx.closePath(); ctx.fillStyle = P.warning; ctx.fill();
  ctx.restore();
}

/* =====================================================================
   R-5
   ===================================================================== */
function drawRobot(row, col, facing, alpha, extra) {
  const scale = scaleNow();
  const options = extra || {};
  const lift = (options.lift || 0);
  const unit = px(CAMERAS[view.camera].tileW * 0.26, 7);

  const floorPoint = project(row + 0.5, col + 0.5, 0);
  const bodyPoint = project(row + 0.5, col + 0.5, 10 * scale + lift);

  ctx.save();
  ctx.globalAlpha = alpha;

  /* shadow on the floor */
  if (QUALITY[view.quality].shadows) {
    ctx.save();
    ctx.globalAlpha = alpha * 0.42;
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.ellipse(floorPoint[0], floorPoint[1], unit*1.05, unit*0.52, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  /* the cyan light R-5 casts on the floor */
  const pool = ctx.createRadialGradient(floorPoint[0], floorPoint[1], 0,
                                        floorPoint[0], floorPoint[1], unit*2.3);
  pool.addColorStop(0, rgba(P.cyan, 0.34 * alpha));
  pool.addColorStop(1, rgba(P.cyan, 0));
  ctx.fillStyle = pool;
  ctx.beginPath(); ctx.arc(floorPoint[0], floorPoint[1], unit*2.3, 0, Math.PI*2); ctx.fill();

  /* hover base */
  ctx.fillStyle = shade(P.metal, -0.25);
  ctx.beginPath();
  ctx.ellipse(bodyPoint[0], bodyPoint[1] + unit*0.55, unit*0.82, unit*0.34, 0, 0, Math.PI*2);
  ctx.fill();

  /* metal body */
  const body = ctx.createLinearGradient(bodyPoint[0], bodyPoint[1]-unit,
                                        bodyPoint[0], bodyPoint[1]+unit*0.7);
  body.addColorStop(0, shade(P.metalLight, 0.34));
  body.addColorStop(0.55, P.metalLight);
  body.addColorStop(1, shade(P.metal, -0.2));
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.ellipse(bodyPoint[0], bodyPoint[1], unit*0.86, unit*0.94, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = rgba("#FFFFFF", 0.42); ctx.lineWidth = 1.1; ctx.stroke();

  /* the cyan identity core, gently pulsing */
  const pulse = REDUCED ? 1 : 0.86 + 0.14 * Math.sin(now / 300);
  ctx.save();
  ctx.shadowColor = P.cyan; ctx.shadowBlur = 16 * pulse;
  ctx.fillStyle = P.cyan;
  ctx.beginPath();
  ctx.arc(bodyPoint[0], bodyPoint[1] - unit*0.05, unit*0.34*pulse, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = "#EAFBFF";
  ctx.beginPath();
  ctx.arc(bodyPoint[0], bodyPoint[1] - unit*0.05, unit*0.16*pulse, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* the direction indicator, so the front of the robot is always obvious */
  const delta = DELTAS[String(facing)] || [1, 0];
  const nose = project(row + 0.5 + delta[0]*0.34, col + 0.5 + delta[1]*0.34,
                       10 * scale + lift);
  ctx.save();
  ctx.fillStyle = "#FFFFFF";
  ctx.shadowColor = P.cyan; ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.arc(nose[0], nose[1], unit*0.17, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* A soft locator column, so R-5 can always be found at a glance even when a
     wall block stands between it and the camera. */
  if (QUALITY[view.quality].decor) {
    const columnTop = project(row + 0.5, col + 0.5, 74 * scale + lift);
    const column = ctx.createLinearGradient(bodyPoint[0], bodyPoint[1],
                                            columnTop[0], columnTop[1]);
    column.addColorStop(0, rgba(P.cyan, 0.30 * alpha));
    column.addColorStop(1, rgba(P.cyan, 0));
    ctx.save();
    ctx.strokeStyle = column;
    ctx.lineWidth = Math.max(3, unit * 0.5);
    ctx.beginPath();
    ctx.moveTo(bodyPoint[0], bodyPoint[1]);
    ctx.lineTo(columnTop[0], columnTop[1]);
    ctx.stroke();
    ctx.restore();
  }

  /* the R-5 marking */
  if (scale > 0.55) {
    ctx.font = "600 " + Math.round(unit*0.62) + "px " +
      '"JetBrains Mono", "SF Mono", Consolas, monospace';
    ctx.textAlign = "center";
    ctx.fillStyle = rgba(P.text, 0.85);
    ctx.fillText(SCENE.meta.robotLabel, bodyPoint[0], bodyPoint[1] - unit*1.25);
  }

  ctx.restore();
}

/* =====================================================================
   Particles
   ===================================================================== */
const particles = [];

function spawnParticles(row, col, colour, count, options) {
  const budget = QUALITY[view.quality].particles;
  if (budget <= 0 || REDUCED) return;
  const settings = options || {};
  const total = Math.round(count * budget);
  for (let i = 0; i < total; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = (settings.speed || 1.4) * (0.4 + Math.random());
    particles.push({
      row: row + 0.5, col: col + 0.5,
      z: (settings.z || 10) + Math.random() * 8,
      vr: Math.sin(angle) * speed * 0.012,
      vc: Math.cos(angle) * speed * 0.012,
      vz: (settings.rise || 0.7) + Math.random() * 1.4,
      life: 1, decay: 0.016 + Math.random() * 0.02,
      colour: colour, size: 1.4 + Math.random() * 1.8
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const particle = particles[i];
    particle.row += particle.vr; particle.col += particle.vc;
    particle.z += particle.vz; particle.vz -= 0.09;
    particle.life -= particle.decay;
    if (particle.life <= 0 || particle.z < -4) particles.splice(i, 1);
  }
}

function drawParticles() {
  const scale = scaleNow();
  particles.forEach(particle => {
    const point = project(particle.row, particle.col, particle.z * scale);
    ctx.save();
    ctx.globalAlpha = clamp(particle.life, 0, 1);
    ctx.fillStyle = particle.colour;
    ctx.shadowColor = particle.colour; ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(point[0], point[1], particle.size * Math.max(0.6, scale), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

/* Slow drifting dust, purely atmospheric. */
const dust = [];
function seedDust() {
  dust.length = 0;
  const count = QUALITY[view.quality].dust;
  for (let i = 0; i < count; i++) {
    dust.push({ row: Math.random()*ROWS, col: Math.random()*COLS,
                z: Math.random()*40 + 6, drift: 0.0006 + Math.random()*0.0016,
                size: 0.7 + Math.random()*1.1 });
  }
}
function drawDust() {
  if (REDUCED) return;
  const scale = scaleNow();
  dust.forEach(speck => {
    speck.col += speck.drift;
    if (speck.col > COLS) speck.col = 0;
    const point = project(speck.row, speck.col, speck.z * scale);
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = P.cyan;
    ctx.beginPath(); ctx.arc(point[0], point[1], speck.size, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });
}

/* =====================================================================
   Frame interpretation
   ===================================================================== */
/* The frame index at which the collectable disappears, or -1 if it is never
   taken. One generic name covers Room 1's battery and Room 2's keycard. */
const itemTakenAt = (() => {
  for (let i = 0; i < FRAMES.length; i++) if (FRAMES[i].item_collected) return i;
  return -1;
})();

/* Should the collectable still be drawn at the point we are up to? */
function itemStillThere() {
  if (itemTakenAt < 0) return true;
  if (view.index < itemTakenAt) return true;
  return view.index === itemTakenAt && view.t < 0.5;
}

/* Which bridges have already gone by this frame, as a lookup of "row,col".
   Room 2 records this on every frame, so the sector can be redrawn correctly at
   any point in a replay without re-running anything. Room 1 has no such field
   and simply gets an empty set. */
function collapsedAt(frame) {
  const set = new Set();
  (frame.collapsed || []).forEach(cell => set.add(cell[0] + "," + cell[1]));
  return set;
}

/* A bridge collapsing is animated on the frame where it happens. */
function collapsingProgress(frame, row, col) {
  if (!frame.bridge_collapsed || !frame.collapsed_cell) return null;
  if (frame.collapsed_cell[0] !== row || frame.collapsed_cell[1] !== col) return null;
